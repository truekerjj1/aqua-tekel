<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

  :root {
    --bg-top: #d9f2e6;
    --bg-mid: #eef8f3;
    --bg-end: #f7fcfa;
    --card: #ffffff;
    --text: #14283a;
    --text-strong: #0a1c2c;
    --muted: #5a6d7c;
    --green: #0a6e48;
    --green-deep: #075538;
    --green-soft: #d4efe3;
    --green-glow: rgba(10, 110, 72, 0.14);
    --border: #cfe0d7;
    --badge-bg: #fff0de;
    --badge-text: #9a4d12;
    --badge-ring: #f0c48a;
    --danger: #c23b3b;
    --ok: #0a6e48;
    --shadow: 0 14px 36px rgba(12, 55, 38, 0.09);
    --radius: 1.05rem;
    --font: "Outfit", "Segoe UI", "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--text);
    background-color: var(--bg-end);
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-top) 0%, transparent 58%),
      radial-gradient(circle at 92% 18%, rgba(10, 110, 72, 0.07) 0%, transparent 28%),
      radial-gradient(circle at 8% 72%, rgba(10, 110, 72, 0.05) 0%, transparent 32%),
      linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-end) 62%);
    background-attachment: fixed;
  }

  body.is-login {
    min-height: 100vh;
  }

  .page {
    max-width: 56rem; /* ~896px — sekmeler sığsın; mobilde yine tam genişlik */
    margin: 0 auto;
    padding: 1.1rem 1.05rem calc(2.4rem + env(safe-area-inset-bottom, 0));
    min-height: 100vh;
  }

  @media (min-width: 720px) {
    .page {
      max-width: 60rem; /* ~960px desktop */
      padding-left: 1.35rem;
      padding-right: 1.35rem;
    }
  }

  /* —— Marka —— */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.35rem;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    min-width: 0;
  }

  .brand-mark {
    flex: 0 0 auto;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--green) 0%, var(--green-deep) 100%);
    color: #fff;
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 16px var(--green-glow);
  }

  .brand-text {
    min-width: 0;
  }

  .brand-name {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 800;
    letter-spacing: 0.055em;
    color: var(--green-deep);
    line-height: 1.1;
  }

  .brand-sub {
    margin: 0.12rem 0 0;
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge-test {
    flex: 0 0 auto;
    max-width: 10.5rem;
    margin: 0;
    padding: 0.38rem 0.55rem;
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    color: var(--badge-text);
    background: var(--badge-bg);
    border: 1px solid var(--badge-ring);
    border-radius: 0.5rem;
  }

  /* —— Giriş —— */
  .login-wrap {
    display: grid;
    place-items: start center;
    padding-top: 0.85rem;
  }

  .login-card {
    width: 100%;
    max-width: 22rem;
    padding: 1.65rem 1.35rem 1.4rem;
    background: var(--card);
    border-radius: calc(var(--radius) + 0.2rem);
    box-shadow: var(--shadow);
    border: 1px solid rgba(10, 110, 72, 0.07);
  }

  .login-icon {
    width: 2.55rem;
    height: 2.55rem;
    margin: 0 auto 0.9rem;
    border-radius: 0.65rem;
    background: linear-gradient(145deg, #f8d86f, #e7b41a);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
  }

  .login-icon svg {
    width: 1.28rem;
    height: 1.28rem;
    fill: #1a1400;
  }

  .login-title {
    margin: 0 0 0.35rem;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }

  .login-lead {
    margin: 0 0 1.3rem;
    text-align: center;
    font-size: 0.9rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .form-login {
    display: grid;
    gap: 0.9rem;
  }

  .form-login label,
  .form label {
    display: grid;
    gap: 0.35rem;
    font-size: 0.82rem;
    font-weight: 700;
    color: #3a4a58;
  }

  .form-login select,
  .form-login input,
  .form select,
  .form input {
    width: 100%;
    padding: 0.72rem 0.85rem;
    font: inherit;
    font-size: 0.96rem;
    font-weight: 500;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    outline: none;
    transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }

  .form-login select:focus,
  .form-login input:focus,
  .form select:focus,
  .form input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-glow);
  }

  .btn {
    margin-top: 0.15rem;
    padding: 0.85rem 0.95rem;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, #0d7a50 0%, var(--green) 100%);
    border: none;
    border-radius: 0.6rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s var(--ease), box-shadow 0.15s ease;
    box-shadow: 0 8px 18px var(--green-glow);
  }

  .btn:hover {
    background: var(--green-deep);
  }

  .btn:active {
    transform: translateY(1px) scale(0.99);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: wait;
    box-shadow: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0.4rem 0.45rem;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-ghost:hover {
    color: var(--green-deep);
  }

  .login-forgot {
    display: block;
    margin: 1rem 0 0;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--green);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }

  .login-forgot:hover {
    text-decoration: underline;
  }

  .form-msg {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    line-height: 1.35;
    font-weight: 600;
  }

  .form-msg.is-ok {
    color: var(--ok);
  }

  .form-msg.is-err {
    color: var(--danger);
  }

  /* —— Uygulama —— */
  .app-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
  }

  .user-chip {
    margin: 0;
    font-size: 0.84rem;
    color: var(--muted);
  }

  .user-chip strong {
    color: var(--text-strong);
    font-weight: 700;
  }

  .role-pill {
    display: inline-block;
    margin-left: 0.3rem;
    padding: 0.14rem 0.45rem;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--green-deep);
    background: var(--green-soft);
    border-radius: 0.4rem;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.28rem;
    margin: 0 -0.15rem 0.9rem;
    padding: 0.1rem 0.15rem 0.45rem;
    /* Dar ekranda wrap yetmezse yatay kaydır; scrollbar görünür */
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tabs::-webkit-scrollbar {
    height: 0.35rem;
  }

  .tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .tab {
    flex: 0 0 auto;
    margin: 0;
    padding: 0.42rem 0.58rem;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s var(--ease);
  }

  .tab:active {
    transform: scale(0.97);
  }

  .tab.is-active {
    color: #fff;
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 6px 14px var(--green-glow);
  }

  .panel {
    padding: 1.15rem 1.05rem 1.25rem;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(10, 110, 72, 0.08);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(12, 55, 38, 0.05);
    backdrop-filter: blur(6px);
  }

  .tab-panel[hidden],
  [hidden] {
    display: none !important;
  }

  .section-title {
    margin: 0 0 0.4rem;
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }

  .section-title--sm {
    margin-top: 1.1rem;
    font-size: 0.92rem;
  }

  .hint {
    margin: 0 0 0.9rem;
    font-size: 0.84rem;
    line-height: 1.4;
    color: var(--muted);
  }

  .hint code {
    font-size: 0.78rem;
    padding: 0.05rem 0.3rem;
    background: var(--green-soft);
    border-radius: 0.25rem;
    color: var(--green-deep);
  }

  .status {
    margin: 0 0 1rem;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-strong);
  }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
    margin-bottom: 1rem;
  }

  .metric {
    padding: 0.7rem 0.55rem;
    text-align: center;
    border-radius: 0.7rem;
    background: linear-gradient(180deg, #f4fbf7 0%, #fff 100%);
    border: 1px solid var(--border);
  }

  .metric-label {
    display: block;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }

  .metric-value {
    display: block;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--green-deep);
  }

  .meta {
    margin: 0 0 1rem;
    display: grid;
    gap: 0.7rem;
  }

  .meta div {
    display: grid;
    gap: 0.12rem;
  }

  .meta dt {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 700;
  }

  .meta dd {
    margin: 0;
    font-size: 0.94rem;
    word-break: break-word;
  }

  .form {
    display: grid;
    gap: 0.65rem;
    margin-bottom: 0.65rem;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.5rem;
  }

  .list li {
    padding: 0.72rem 0.8rem;
    font-size: 0.9rem;
    line-height: 1.35;
    border-bottom: 1px solid var(--border);
    background: transparent;
  }

  .list li:last-child {
    border-bottom: none;
  }

  .list .muted {
    color: var(--muted);
    font-size: 0.78rem;
  }

  .borc-value {
    color: var(--green-deep);
    font-weight: 800;
  }

  .debt-list li {
    display: grid;
    gap: 0.2rem;
  }

  .debt-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
  }

  .patron-only[hidden] {
    display: none !important;
  }

  .tab-badge {
    display: inline-block;
    margin-left: 0.2rem;
    min-width: 1.1rem;
    padding: 0.05rem 0.35rem;
    font-size: 0.62rem;
    font-weight: 800;
    color: #fff;
    background: var(--danger);
    border-radius: 999px;
    vertical-align: middle;
  }

  .badge-durum {
    display: inline-block;
    margin-left: 0.25rem;
    padding: 0.12rem 0.4rem;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 0.35rem;
    background: #e8eef2;
    color: var(--muted);
  }

  .badge-durum.is-wait {
    background: #fff0de;
    color: var(--badge-text);
  }

  .badge-durum.is-ok {
    background: var(--green-soft);
    color: var(--green-deep);
  }

  .badge-durum.is-err {
    background: #fde8e8;
    color: var(--danger);
  }

  .row-actions {
    margin-top: 0.4rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .btn-sm {
    margin: 0;
    padding: 0.35rem 0.65rem;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--green-deep);
    background: var(--green-soft);
    border: 1px solid var(--border);
    border-radius: 0.45rem;
    cursor: pointer;
  }

  .btn-sm.is-active {
    color: #fff;
    background: var(--green);
    border-color: var(--green);
  }

  .btn-sm.btn-danger {
    color: #fff;
    background: var(--danger);
    border-color: var(--danger);
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .filter-row {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }

  .metric-row--4 {
    grid-template-columns: repeat(2, 1fr);
  }

  @media (min-width: 420px) {
    .metric-row--4 {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .chart-wrap {
    margin: 0 0 0.9rem;
    padding: 0.7rem 0.55rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    background: linear-gradient(180deg, #f4fbf7 0%, #fff 100%);
  }

  .chart-title {
    margin: 0 0 0.5rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 0.35rem;
    min-height: 5.5rem;
    padding: 0 0.15rem;
  }

  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    min-width: 0;
  }

  .chart-bar {
    width: 100%;
    max-width: 1.6rem;
    border-radius: 0.3rem 0.3rem 0.1rem 0.1rem;
    background: linear-gradient(180deg, #0d7a50 0%, var(--green) 100%);
    transition: height 0.35s var(--ease);
  }

  .chart-label {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    word-break: break-all;
  }

  .list a {
    color: var(--green);
    font-weight: 700;
  }

  /* —— Motion —— */
  @keyframes rise-in {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .anim-rise {
    animation: rise-in 0.45s var(--ease) both;
  }

  .anim-fade {
    animation: fade-in 0.35s var(--ease) both;
  }

  .tab-panel.is-active {
    animation: fade-in 0.28s var(--ease) both;
  }

  @media (prefers-reduced-motion: reduce) {
    .anim-rise,
    .anim-fade,
    .tab-panel.is-active,
    .tab,
    .btn {
      animation: none;
      transition: none;
    }
  }

  @media (max-width: 380px) {
    .badge-test {
      max-width: 8.2rem;
      font-size: 0.56rem;
    }

    .brand-name {
      font-size: 0.98rem;
    }

    .metric-value {
      font-size: 0.86rem;
    }

    .tab {
      padding: 0.38rem 0.5rem;
      font-size: 0.68rem;
    }
  }
</style>
