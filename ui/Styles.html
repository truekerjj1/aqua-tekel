<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap');

  :root {
    --bg: #080808;
    --bg-elevated: #121212;
    --bg-panel: #161616;
    --bg-input: #0e0e0e;
    --surface-line: #2a2a2a;
    --text: #ececec;
    --text-strong: #ffffff;
    --muted: #9a9a9a;
    --yellow: #f5c518;
    --yellow-deep: #d4a50a;
    --yellow-soft: rgba(245, 197, 24, 0.14);
    --yellow-glow: rgba(245, 197, 24, 0.22);
    --border: #333333;
    --badge-bg: #f5c518;
    --badge-text: #0a0a0a;
    --danger: #e85d5d;
    --ok: #f5c518;
    --ok-soft: rgba(245, 197, 24, 0.12);
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    --radius: 0.85rem;
    --font-display: "Syne", "Segoe UI", sans-serif;
    --font: "Figtree", "Segoe UI", "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -15%, rgba(245, 197, 24, 0.16) 0%, transparent 55%),
      radial-gradient(circle at 88% 12%, rgba(245, 197, 24, 0.06) 0%, transparent 26%),
      linear-gradient(180deg, #0c0c0c 0%, var(--bg) 48%, #050505 100%);
    background-attachment: fixed;
  }

  body.is-login {
    min-height: 100vh;
  }

  .page {
    max-width: 56rem;
    margin: 0 auto;
    padding: 1.1rem 1.05rem calc(2.4rem + env(safe-area-inset-bottom, 0));
    min-height: 100vh;
  }

  @media (min-width: 720px) {
    .page {
      max-width: 60rem;
      padding-left: 1.35rem;
      padding-right: 1.35rem;
    }
  }

  /* —— Marka —— */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.2rem;
  }

  body.is-login .site-header {
    display: none;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    min-width: 0;
  }

  .brand-mark {
    flex: 0 0 auto;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.45rem;
    background: var(--yellow);
    color: #0a0a0a;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    display: grid;
    place-items: center;
    box-shadow: 0 0 0 1px rgba(245, 197, 24, 0.35);
  }

  .brand-logo {
    flex: 0 0 auto;
    display: block;
    line-height: 0;
  }

  .logo-svg {
    display: block;
    width: 2.55rem;
    height: 2.55rem;
    border-radius: 0.5rem;
    box-shadow: 0 0 0 1px rgba(245, 197, 24, 0.4);
  }

  .logo-svg--sm {
    width: 2.55rem;
    height: 2.55rem;
  }

  .logo-svg--hero {
    width: clamp(4.5rem, 18vw, 5.75rem);
    height: clamp(4.5rem, 18vw, 5.75rem);
    border-radius: 1rem;
    box-shadow:
      0 0 0 1px rgba(245, 197, 24, 0.45),
      0 16px 36px rgba(245, 197, 24, 0.22);
  }

  .login-logo-wrap {
    display: flex;
    justify-content: center;
    margin: 0 auto 1rem;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex: 0 0 auto;
  }

  .nav-toggle {
    display: none;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.5rem;
    min-width: 2.5rem;
    padding: 0.4rem 0.55rem;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: #0a0a0a;
    background: var(--yellow);
    border: none;
    border-radius: 0.45rem;
    cursor: pointer;
  }

  .nav-toggle-bars {
    display: block;
    width: 1rem;
    height: 0.7rem;
    background:
      linear-gradient(#0a0a0a, #0a0a0a) 0 0 / 100% 2px no-repeat,
      linear-gradient(#0a0a0a, #0a0a0a) 0 50% / 100% 2px no-repeat,
      linear-gradient(#0a0a0a, #0a0a0a) 0 100% / 100% 2px no-repeat;
  }

  .nav-toggle[aria-expanded='true'] .nav-toggle-bars {
    background:
      linear-gradient(#0a0a0a, #0a0a0a) 0 50% / 100% 2px no-repeat;
  }

  .nav-toggle-label {
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--yellow);
    line-height: 1.1;
  }

  .brand-sub {
    margin: 0.12rem 0 0;
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge-test {
    flex: 0 0 auto;
    max-width: 11rem;
    margin: 0;
    padding: 0.38rem 0.55rem;
    font-size: 0.58rem;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--badge-text);
    background: var(--badge-bg);
    border: 1px solid var(--yellow-deep);
    border-radius: 0.35rem;
  }

  /* —— Giriş (marka hero) —— */
  .login-wrap {
    display: grid;
    place-items: start center;
    padding-top: 1.4rem;
    gap: 1.35rem;
  }

  .login-hero {
    width: 100%;
    max-width: 26rem;
    text-align: center;
    padding: 0.4rem 0.25rem 0;
  }

  .login-brand {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(2.15rem, 8.5vw, 3.1rem);
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--yellow);
    line-height: 1.02;
    text-shadow: 0 2px 24px rgba(245, 197, 24, 0.18);
  }

  .login-tagline {
    margin: 0.55rem 0 0;
    font-size: 0.95rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  .login-badge {
    display: inline-block;
    margin-top: 0.9rem;
    padding: 0.35rem 0.65rem;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0a0a0a;
    background: var(--yellow);
    border-radius: 0.3rem;
  }

  .login-card {
    width: 100%;
    max-width: 22rem;
    padding: 1.55rem 1.3rem 1.35rem;
    background: var(--bg-elevated);
    border-radius: calc(var(--radius) + 0.1rem);
    box-shadow: var(--shadow);
    border: 1px solid var(--surface-line);
  }

  .login-title {
    margin: 0 0 0.3rem;
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.28rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }

  .login-lead {
    margin: 0 0 1.2rem;
    text-align: center;
    font-size: 0.88rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .form-login {
    display: grid;
    gap: 0.9rem;
  }

  .form-login label,
  .form label {
    display: grid;
    gap: 0.35rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: #c8c8c8;
  }

  .form-login select,
  .form-login input,
  .form select,
  .form input {
    width: 100%;
    padding: 0.75rem 0.85rem;
    font: inherit;
    font-size: 0.96rem;
    font-weight: 500;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 0.55rem;
    outline: none;
    transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }

  .form-login select option,
  .form select option {
    background: #141414;
    color: var(--text);
  }

  .form-login select:focus,
  .form-login input:focus,
  .form select:focus,
  .form input:focus {
    border-color: var(--yellow);
    box-shadow: 0 0 0 3px var(--yellow-soft);
  }

  .btn {
    margin-top: 0.15rem;
    padding: 0.85rem 0.95rem;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #0a0a0a;
    background: var(--yellow);
    border: none;
    border-radius: 0.55rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s var(--ease), box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow: 0 8px 20px var(--yellow-glow);
  }

  .btn:hover {
    background: #ffd54a;
    filter: brightness(1.03);
    box-shadow: 0 10px 24px rgba(245, 197, 24, 0.32);
  }

  .btn:active {
    transform: translateY(1px) scale(0.99);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: wait;
    box-shadow: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0.4rem 0.45rem;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .btn-ghost:hover {
    color: var(--yellow);
  }

  .login-forgot {
    display: block;
    margin: 1rem 0 0;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--yellow);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }

  .login-forgot:hover {
    text-decoration: underline;
  }

  .form-msg {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    line-height: 1.35;
    font-weight: 600;
  }

  .form-msg.is-ok {
    color: var(--yellow);
  }

  .form-msg.is-err {
    color: var(--danger);
  }

  /* —— Uygulama —— */
  .app-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
  }

  .user-chip {
    margin: 0;
    font-size: 0.84rem;
    color: var(--muted);
  }

  .user-chip strong {
    color: var(--text-strong);
    font-weight: 700;
  }

  .role-pill {
    display: inline-block;
    margin-left: 0.3rem;
    padding: 0.14rem 0.45rem;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #0a0a0a;
    background: var(--yellow);
    border-radius: 0.35rem;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.28rem;
    margin: 0 -0.15rem 0.9rem;
    padding: 0.1rem 0.15rem 0.45rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tabs.is-open {
    display: flex;
  }

  .tabs::-webkit-scrollbar {
    height: 0.35rem;
  }

  .tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .tab {
    flex: 0 0 auto;
    margin: 0;
    min-height: 2.4rem;
    padding: 0.5rem 0.7rem;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s var(--ease);
  }

  .tab:hover {
    border-color: rgba(245, 197, 24, 0.45);
    color: var(--text);
  }

  .tab:active {
    transform: scale(0.97);
  }

  .tab.is-active {
    color: #0a0a0a;
    background: var(--yellow);
    border-color: var(--yellow);
    box-shadow: 0 4px 14px var(--yellow-glow);
  }

  .panel {
    padding: 1.15rem 1.05rem 1.25rem;
    background: var(--bg-panel);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
  }

  .tab-panel[hidden],
  [hidden] {
    display: none !important;
  }

  .section-title {
    margin: 0 0 0.4rem;
    font-family: var(--font-display);
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }

  .section-title--sm {
    margin-top: 1.1rem;
    font-size: 0.92rem;
  }

  .hint {
    margin: 0 0 0.9rem;
    font-size: 0.84rem;
    line-height: 1.4;
    color: var(--muted);
  }

  .hint code {
    font-size: 0.78rem;
    padding: 0.05rem 0.3rem;
    background: var(--yellow-soft);
    border-radius: 0.25rem;
    color: var(--yellow);
  }

  .status {
    margin: 0 0 1rem;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-strong);
  }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
    margin-bottom: 1rem;
  }

  .metric {
    padding: 0.7rem 0.55rem;
    text-align: center;
    border-radius: 0.55rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
  }

  .metric-label {
    display: block;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }

  .metric-value {
    display: block;
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--yellow);
  }

  .meta {
    margin: 0 0 1rem;
    display: grid;
    gap: 0.7rem;
  }

  .meta div {
    display: grid;
    gap: 0.12rem;
  }

  .meta dt {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 700;
  }

  .meta dd {
    margin: 0;
    font-size: 0.94rem;
    word-break: break-word;
  }

  .form {
    display: grid;
    gap: 0.75rem;
    margin-bottom: 0.65rem;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0;
  }

  .list li {
    padding: 0.72rem 0.15rem;
    font-size: 0.9rem;
    line-height: 1.35;
    border-bottom: 1px solid var(--border);
    background: transparent;
  }

  .list li:last-child {
    border-bottom: none;
  }

  .list .muted,
  .list-empty {
    color: var(--muted);
    font-size: 0.82rem;
  }

  .list-empty {
    border-bottom: none !important;
    padding-top: 0.85rem;
    padding-bottom: 0.85rem;
  }

  .borc-value {
    color: var(--yellow);
    font-weight: 800;
  }

  .debt-list li {
    display: grid;
    gap: 0.2rem;
  }

  .debt-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
  }

  .patron-only[hidden] {
    display: none !important;
  }

  .tab-badge {
    display: inline-block;
    margin-left: 0.2rem;
    min-width: 1.1rem;
    padding: 0.05rem 0.35rem;
    font-size: 0.62rem;
    font-weight: 800;
    color: #fff;
    background: var(--danger);
    border-radius: 999px;
    vertical-align: middle;
  }

  .badge-durum {
    display: inline-block;
    margin-left: 0.25rem;
    padding: 0.12rem 0.4rem;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 0.3rem;
    background: #2a2a2a;
    color: var(--muted);
  }

  .badge-durum.is-wait {
    background: var(--yellow-soft);
    color: var(--yellow);
  }

  .badge-durum.is-ok {
    background: rgba(245, 197, 24, 0.18);
    color: var(--yellow);
  }

  .badge-durum.is-err {
    background: rgba(232, 93, 93, 0.18);
    color: var(--danger);
  }

  .row-actions {
    margin-top: 0.4rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .btn-sm {
    margin: 0;
    min-height: 2.25rem;
    padding: 0.45rem 0.75rem;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--yellow);
    background: transparent;
    border: 1px solid rgba(245, 197, 24, 0.45);
    border-radius: 0.4rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-sm:hover {
    background: var(--yellow-soft);
  }

  .btn-sm.is-active {
    color: #0a0a0a;
    background: var(--yellow);
    border-color: var(--yellow);
  }

  .btn-sm.btn-danger {
    color: #fff;
    background: var(--danger);
    border-color: var(--danger);
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .filter-row {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }

  .metric-row--4 {
    grid-template-columns: repeat(2, 1fr);
  }

  @media (min-width: 420px) {
    .metric-row--4 {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .chart-wrap {
    margin: 0 0 0.9rem;
    padding: 0.7rem 0.55rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.55rem;
    background: var(--bg-elevated);
  }

  .chart-title {
    margin: 0 0 0.5rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 0.35rem;
    min-height: 5.5rem;
    padding: 0 0.15rem;
  }

  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    min-width: 0;
  }

  .chart-bar {
    width: 100%;
    max-width: 1.6rem;
    border-radius: 0.25rem 0.25rem 0.1rem 0.1rem;
    background: linear-gradient(180deg, #ffe066 0%, var(--yellow) 100%);
    transition: height 0.35s var(--ease);
  }

  .chart-label {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    word-break: break-all;
  }

  .list a {
    color: var(--yellow);
    font-weight: 700;
  }

  /* —— Yönetici tarih takvim tablosu —— */
  .date-range-pickers {
    display: grid;
    gap: 0.85rem;
  }

  @media (min-width: 640px) {
    .date-range-pickers {
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
  }

  .date-picker {
    display: grid;
    gap: 0.45rem;
    padding: 0.75rem 0.7rem 0.65rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 0.55rem;
  }

  .date-picker-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: #c8c8c8;
  }

  .date-picker-value {
    margin: 0;
    min-height: 1.35rem;
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--yellow);
  }

  .date-picker-value.is-empty {
    font-family: var(--font);
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--muted);
  }

  .date-cal {
    width: 100%;
  }

  .date-cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.35rem;
    margin-bottom: 0.4rem;
  }

  .date-cal-title {
    flex: 1;
    margin: 0;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-strong);
    text-transform: capitalize;
  }

  .date-cal-nav-btn {
    flex: 0 0 auto;
    width: 2rem;
    height: 2rem;
    padding: 0;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    color: var(--yellow);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    cursor: pointer;
    transition: border-color 0.18s var(--ease), background 0.18s var(--ease);
  }

  .date-cal-nav-btn:hover,
  .date-cal-nav-btn:focus-visible {
    border-color: var(--yellow);
    background: var(--yellow-soft);
    outline: none;
  }

  .date-cal-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
