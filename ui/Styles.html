<style>
  :root {
    --bg: #0c1a24;
    --bg-mid: #123044;
    --card: #16374f;
    --text: #f2f7fb;
    --muted: #a8c0d0;
    --accent: #3db8a0;
    --badge: #c9a227;
    --border: rgba(255, 255, 255, 0.12);
    --danger: #e07a7a;
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(120% 80% at 10% 0%, #1a4a5c 0%, transparent 55%),
      radial-gradient(90% 70% at 100% 20%, #0e2f3a 0%, transparent 50%),
      linear-gradient(160deg, var(--bg), var(--bg-mid));
  }

  .page {
    max-width: 28rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2.5rem;
    min-height: 100vh;
  }

  .top {
    margin-bottom: 1.25rem;
  }

  .badge {
    display: inline-block;
    margin: 0 0 0.75rem;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1a1400;
    background: var(--badge);
    border-radius: 0.25rem;
  }

  .brand {
    margin: 0 0 0.5rem;
    font-size: clamp(1.85rem, 7vw, 2.35rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .lead {
    margin: 0 0 0.5rem;
    font-size: 1.15rem;
    color: var(--accent);
    font-weight: 600;
  }

  .sub {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.35rem;
    margin-bottom: 0.85rem;
  }

  .tab {
    margin: 0;
    padding: 0.55rem 0.25rem;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 0.45rem;
    cursor: pointer;
  }

  .tab.is-active {
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 22%, var(--card));
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }

  .panel {
    padding: 1.15rem 1.1rem;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
  }

  .tab-panel[hidden] {
    display: none;
  }

  .section-title {
    margin: 0 0 0.5rem;
    font-size: 1.05rem;
  }

  .status {
    margin: 0 0 1rem;
    font-size: 0.95rem;
  }

  .meta {
    margin: 0 0 1rem;
    display: grid;
    gap: 0.75rem;
  }

  .meta div {
    display: grid;
    gap: 0.15rem;
  }

  .meta dt {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .meta dd {
    margin: 0;
    font-size: 0.95rem;
    word-break: break-all;
  }

  .hint {
    margin: 0 0 0.85rem;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--muted);
  }

  .form {
    display: grid;
    gap: 0.65rem;
    margin-bottom: 0.75rem;
  }

  .form label {
    display: grid;
    gap: 0.25rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .form input {
    width: 100%;
    padding: 0.55rem 0.65rem;
    font: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
  }

  .btn {
    margin-top: 0.25rem;
    padding: 0.65rem 0.85rem;
    font: inherit;
    font-weight: 600;
    color: #06241e;
    background: var(--accent);
    border: none;
    border-radius: 0.45rem;
    cursor: pointer;
  }

  .form-msg {
    margin: 0 0 0.75rem;
    font-size: 0.85rem;
    line-height: 1.35;
  }

  .form-msg.is-ok {
    color: var(--accent);
  }

  .form-msg.is-err {
    color: var(--danger);
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.5rem;
  }

  .list li {
    padding: 0.55rem 0.65rem;
    font-size: 0.88rem;
    line-height: 1.35;
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    background: color-mix(in srgb, var(--bg) 35%, transparent);
  }

  .list .muted {
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
