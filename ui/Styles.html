<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap');

  :root {
    --bg: #060606;
    --bg-elevated: #101010;
    --bg-panel: #0c0c0c;
    --bg-input: #080808;
    --surface-line: #242424;
    --text: #e8e6e1;
    --text-strong: #faf9f6;
    --muted: #8f8c84;
    --yellow: #f5c518;
    --yellow-deep: #c9a012;
    --yellow-soft: rgba(245, 197, 24, 0.12);
    --yellow-mid: rgba(245, 197, 24, 0.28);
    --border: #2e2e2e;
    --badge-bg: #f5c518;
    --badge-text: #0a0a0a;
    --danger: #e85d5d;
    --ok: #f5c518;
    --ok-soft: rgba(245, 197, 24, 0.1);
    --shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
    --radius: 0.35rem;
    --font-display: "Syne", "Avenir Next", sans-serif;
    --font: "Manrope", "Avenir Next", "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --page-max: 64rem;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 110% 70% at 50% -20%, rgba(245, 197, 24, 0.14) 0%, transparent 52%),
      radial-gradient(ellipse 50% 40% at 100% 100%, rgba(245, 197, 24, 0.04) 0%, transparent 50%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 47px,
        rgba(245, 197, 24, 0.025) 47px,
        rgba(245, 197, 24, 0.025) 48px
      ),
      linear-gradient(165deg, #0a0a0a 0%, var(--bg) 42%, #030303 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  body.is-login {
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 90% 55% at 18% 12%, rgba(245, 197, 24, 0.2) 0%, transparent 45%),
      radial-gradient(ellipse 70% 50% at 88% 78%, rgba(245, 197, 24, 0.07) 0%, transparent 48%),
      repeating-linear-gradient(
        -18deg,
        transparent,
        transparent 28px,
        rgba(245, 197, 24, 0.03) 28px,
        rgba(245, 197, 24, 0.03) 29px
      ),
      linear-gradient(160deg, #0b0b0b 0%, #050505 55%, #000 100%);
  }

  .page {
    max-width: var(--page-max);
    margin: 0 auto;
    padding: 1.15rem 1.15rem calc(2.5rem + env(safe-area-inset-bottom, 0));
    min-height: 100vh;
    position: relative;
  }

  body.is-login .page {
    max-width: none;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 720px) {
    .page {
      padding-left: 1.6rem;
      padding-right: 1.6rem;
    }

    body.is-login .page {
      padding: 0;
    }
  }

  /* —— Marka / üst bar —— */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    margin: 0 0 1.35rem;
    padding-bottom: 0.95rem;
    border-bottom: 1px solid var(--surface-line);
    position: relative;
  }

  .site-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 4.5rem;
    height: 2px;
    background: var(--yellow);
  }

  body.is-login .site-header {
    display: none;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    min-width: 0;
  }

  .brand-mark {
    flex: 0 0 auto;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 0.3rem;
    background: var(--yellow);
    color: #0a0a0a;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    display: grid;
    place-items: center;
  }

  .brand-logo {
    flex: 0 0 auto;
    display: block;
    line-height: 0;
  }

  .logo-svg {
    display: block;
    width: 2.45rem;
    height: 2.45rem;
    border-radius: 0.3rem;
  }

  .logo-svg--sm {
    width: 2.45rem;
    height: 2.45rem;
  }

  .logo-svg--hero {
    width: clamp(3.6rem, 12vw, 4.75rem);
    height: clamp(3.6rem, 12vw, 4.75rem);
    border-radius: 0.45rem;
    margin: 0 0 1.25rem;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--yellow);
    line-height: 1.05;
  }

  .brand-sub {
    margin: 0.15rem 0 0;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex: 0 0 auto;
  }

  .badge-test {
    flex: 0 0 auto;
    max-width: 12rem;
    margin: 0;
    padding: 0.4rem 0.55rem;
    font-size: 0.56rem;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--badge-text);
    background: var(--badge-bg);
    border-radius: 0.2rem;
  }

  .nav-toggle {
    display: none;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.6rem;
    min-width: 2.6rem;
    padding: 0.45rem 0.65rem;
    font: inherit;
    font-size: 0.7rem;
    font-weight: 800;
    color: #0a0a0a;
    background: var(--yellow);
    border: none;
    border-radius: 0.25rem;
    cursor: pointer;
  }

  .nav-toggle-bars {
    display: block;
    width: 1.05rem;
    height: 0.72rem;
    background:
      linear-gradient(#0a0a0a, #0a0a0a) 0 0 / 100% 2px no-repeat,
      linear-gradient(#0a0a0a, #0a0a0a) 0 50% / 100% 2px no-repeat,
      linear-gradient(#0a0a0a, #0a0a0a) 0 100% / 100% 2px no-repeat;
  }

  .nav-toggle[aria-expanded='true'] .nav-toggle-bars {
    background: linear-gradient(#0a0a0a, #0a0a0a) 0 50% / 100% 2px no-repeat;
  }

  .nav-toggle-label {
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* —— Giriş: tam ekran kompozisyon —— */
  .login-stage,
  .login-wrap {
    position: relative;
    flex: 1;
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    align-items: end;
    padding: clamp(1.5rem, 5vh, 3rem) clamp(1.1rem, 4vw, 2.5rem) clamp(1.4rem, 4vh, 2.2rem);
    overflow: hidden;
  }

  .login-bleed {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .login-bleed-grid {
    position: absolute;
    inset: 0;
    opacity: 0.55;
    background-image:
      linear-gradient(rgba(245, 197, 24, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245, 197, 24, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 70% at 40% 30%, #000 20%, transparent 75%);
  }

  .login-bleed-wash {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(circle at 30% 20%, rgba(245, 197, 24, 0.16), transparent 42%),
      radial-gradient(circle at 70% 90%, rgba(245, 197, 24, 0.06), transparent 40%);
    animation: wash-drift 14s var(--ease) infinite alternate;
  }

  .login-hero {
    position: relative;
    z-index: 1;
    align-self: center;
    justify-self: start;
    width: 100%;
    max-width: 42rem;
    padding: 0 0 1.5rem;
    text-align: left;
  }

  .login-brand {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 11vw, 5.2rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--yellow);
    line-height: 0.95;
  }

  .login-tagline {
    margin: 1rem 0 0;
    max-width: 22rem;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
    line-height: 1.4;
  }

  .login-badge {
    display: none;
  }

  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 24rem;
    justify-self: start;
    padding: 1.45rem 1.35rem 1.25rem;
    background: rgba(12, 12, 12, 0.92);
    border: 1px solid var(--surface-line);
    border-top: 2px solid var(--yellow);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
  }

  .login-title {
    margin: 0 0 0.25rem;
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.02em;
  }

  .login-lead {
    margin: 0 0 1.15rem;
    font-size: 0.86rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .login-env {
    margin: 1rem 0 0;
    padding-top: 0.85rem;
    border-top: 1px solid var(--surface-line);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.35;
  }

  .form-login {
    display: grid;
    gap: 0.9rem;
  }

  .form-login label,
  .form label {
    display: grid;
    gap: 0.38rem;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #b8b4aa;
  }

  .form-login select,
  .form-login input,
  .form select,
  .form input {
    width: 100%;
    padding: 0.78rem 0.9rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 0.3rem;
    outline: none;
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .form-login select option,
  .form select option {
    background: #141414;
    color: var(--text);
  }

  .form-login select:focus,
  .form-login input:focus,
  .form select:focus,
  .form input:focus {
    border-color: var(--yellow);
    box-shadow: 0 0 0 3px var(--yellow-soft);
  }

  .btn {
    margin-top: 0.2rem;
    padding: 0.9rem 1rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #0a0a0a;
    background: var(--yellow);
    border: none;
    border-radius: 0.3rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s var(--ease), filter 0.15s ease;
  }

  .btn:hover {
    background: #ffd54a;
    filter: brightness(1.02);
  }

  .btn:active {
    transform: translateY(1px) scale(0.99);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: wait;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0.45rem 0.5rem;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .btn-ghost:hover {
    color: var(--yellow);
  }

  .login-forgot {
    display: block;
    margin: 0.95rem 0 0;
    text-align: left;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--yellow);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    padding: 0;
  }

  .login-forgot:hover {
    text-decoration: underline;
  }

  .form-msg {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    line-height: 1.35;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }

  .form-msg.is-ok {
    color: var(--yellow);
  }

  .form-msg.is-err {
    color: var(--danger);
  }

  /* —— Uygulama kabuğu —— */
  .app-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .user-chip {
    margin: 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .user-chip strong {
    color: var(--text-strong);
    font-weight: 700;
  }

  .role-pill {
    display: inline-block;
    margin-left: 0.35rem;
    padding: 0.18rem 0.5rem;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #0a0a0a;
    background: var(--yellow);
    border-radius: 0.2rem;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.15rem 0.1rem;
    margin: 0 0 1.15rem;
    padding: 0 0 0.55rem;
    border-bottom: 1px solid var(--surface-line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tabs.is-open {
    display: flex;
  }

  .tabs::-webkit-scrollbar {
    height: 0.3rem;
  }

  .tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .tab {
    flex: 0 0 auto;
    margin: 0;
    min-height: 2.45rem;
    padding: 0.55rem 0.75rem;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .tab:hover {
    color: var(--text);
  }

  .tab:active {
    transform: none;
  }

  .tab.is-active {
    color: var(--yellow);
    background: transparent;
    border-bottom-color: var(--yellow);
    box-shadow: none;
  }

  .panel {
    padding: 0.15rem 0 0.5rem;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }

  .tab-panel[hidden],
  [hidden] {
    display: none !important;
  }

  .section-title {
    margin: 0 0 0.45rem;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.015em;
  }

  .section-title--sm {
    margin-top: 1.45rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--surface-line);
    font-size: 0.95rem;
  }

  .hint {
    margin: 0 0 1rem;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .hint code {
    font-size: 0.76rem;
    padding: 0.08rem 0.32rem;
    background: var(--yellow-soft);
    border-radius: 0.2rem;
    color: var(--yellow);
  }

  .status {
    margin: 0 0 1.15rem;
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.02em;
  }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-bottom: 1.35rem;
    border-top: 1px solid var(--surface-line);
    border-bottom: 1px solid var(--surface-line);
  }

  .metric {
    padding: 0.95rem 0.65rem 1rem;
    text-align: left;
    border-radius: 0;
    background: transparent;
    border: none;
    border-right: 1px solid var(--surface-line);
  }

  .metric:last-child {
    border-right: none;
  }

  .metric-label {
    display: block;
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .metric-value {
    display: block;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--yellow);
    letter-spacing: -0.01em;
  }

  .meta {
    margin: 0 0 1.25rem;
    display: grid;
    gap: 0.85rem;
  }

  .meta div {
    display: grid;
    gap: 0.15rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--surface-line);
  }

  .meta dt {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    font-weight: 700;
  }

  .meta dd {
    margin: 0;
    font-size: 0.95rem;
    word-break: break-word;
  }

  .form {
    display: grid;
    gap: 0.8rem;
    margin-bottom: 0.75rem;
    max-width: 28rem;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0;
  }

  .list li {
    padding: 0.85rem 0.1rem;
    font-size: 0.9rem;
    line-height: 1.4;
    border-bottom: 1px solid var(--surface-line);
    background: transparent;
  }

  .list li:last-child {
    border-bottom: none;
  }

  .list .muted,
  .list-empty {
    color: var(--muted);
    font-size: 0.84rem;
  }

  .list-empty {
    border-bottom: none !important;
    padding-top: 1rem;
    padding-bottom: 1rem;
  }

  .borc-value {
    color: var(--yellow);
    font-weight: 800;
  }

  .debt-list li {
    display: grid;
    gap: 0.2rem;
  }

  .debt-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
  }

  .patron-only[hidden] {
    display: none !important;
  }

  .tab-badge {
    display: inline-block;
    margin-left: 0.25rem;
    min-width: 1.15rem;
    padding: 0.05rem 0.35rem;
    font-size: 0.62rem;
    font-weight: 800;
    color: #fff;
    background: var(--danger);
    border-radius: 999px;
    vertical-align: middle;
  }

  .badge-durum {
    display: inline-block;
    margin-left: 0.25rem;
    padding: 0.12rem 0.4rem;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 0.2rem;
    background: #1c1c1c;
    color: var(--muted);
  }

  .badge-durum.is-wait {
    background: var(--yellow-soft);
    color: var(--yellow);
  }

  .badge-durum.is-ok {
    background: rgba(245, 197, 24, 0.16);
    color: var(--yellow);
  }

  .badge-durum.is-err {
    background: rgba(232, 93, 93, 0.16);
    color: var(--danger);
  }

  .row-actions {
    margin-top: 0.45rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .btn-sm {
    margin: 0;
    min-height: 2.3rem;
    padding: 0.45rem 0.8rem;
    font: inherit;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--yellow);
    background: transparent;
    border: 1px solid var(--yellow-mid);
    border-radius: 0.25rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-sm:hover {
    background: var(--yellow-soft);
  }

  .btn-sm.is-active {
    color: #0a0a0a;
    background: var(--yellow);
    border-color: var(--yellow);
  }

  .btn-sm.btn-danger {
    color: #fff;
    background: var(--danger);
    border-color: var(--danger);
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .filter-row {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.85rem;
  }

  .metric-row--4 {
    grid-template-columns: repeat(2, 1fr);
  }

  .metric-row--4 .metric:nth-child(2n) {
    border-right: none;
  }

  @media (min-width: 520px) {
    .metric-row--4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .metric-row--4 .metric:nth-child(2n) {
      border-right: 1px solid var(--surface-line);
    }

    .metric-row--4 .metric:last-child {
      border-right: none;
    }
  }

  .chart-wrap {
    margin: 0 0 1rem;
    padding: 0.85rem 0.65rem 0.55rem;
    border: 1px solid var(--surface-line);
    border-radius: var(--radius);
    background: var(--bg-elevated);
  }

  .chart-title {
    margin: 0 0 0.55rem;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 0.4rem;
    min-height: 5.5rem;
    padding: 0 0.15rem;
  }

  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
