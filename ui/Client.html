<script>
  (function () {
    var loginView = document.getElementById('login-view');
    var appView = document.getElementById('app-view');
    var statusEl = document.getElementById('status');
    var metaEl = document.getElementById('meta');
    var roleEl = document.getElementById('role');
    var emailEl = document.getElementById('email');
    var sheetEl = document.getElementById('sheet');
    var yazmaEl = document.getElementById('yazma');
    var ayarEl = document.getElementById('ayar');
    var metaAyar = document.getElementById('meta-ayar');
    var summaryEl = document.getElementById('summary-totals');
    var sumGelirEl = document.getElementById('sum-gelir');
    var sumGiderEl = document.getElementById('sum-gider');
    var sumBorcEl = document.getElementById('sum-borc');
    var listBorcOzet = document.getElementById('list-borc-ozet');
    var chipName = document.getElementById('chip-name');
    var chipRole = document.getElementById('chip-role');
    var loginUser = document.getElementById('login-user');
    var loginCode = document.getElementById('login-code');
    var btnLogin = document.getElementById('btn-login');
    var formFatura = document.getElementById('form-fatura');
    var hintFatura = document.getElementById('hint-fatura');
    var currentSession = null;
    var onayFiltre = 'Bekliyor';
    var MAX_DEKONT = 5 * 1024 * 1024;
    var tabs = document.querySelectorAll('.tab');
    var panels = {
      ozet: document.getElementById('panel-ozet'),
      gelir: document.getElementById('panel-gelir'),
      gider: document.getElementById('panel-gider'),
      odeme: document.getElementById('panel-odeme'),
      fatura: document.getElementById('panel-fatura'),
      profil: document.getElementById('panel-profil'),
      onay: document.getElementById('panel-onay'),
      tedarikci: document.getElementById('panel-tedarikci'),
      yonetici: document.getElementById('panel-yonetici'),
      ayarlar: document.getElementById('panel-ayarlar')
    };
    var supplierSelectIds = [
      'select-fatura-tedarikci',
      'select-odeme-tedarikci',
      'select-admin-tedarikci'
    ];

    function hasGas() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function rolMetni(rol) {
      if (rol === 'patron') return 'Patron';
      if (rol === 'personel') return 'Personel';
      return 'Misafir';
    }

    function isPatron(session) {
      return !!(session && (session.canManage || session.rol === 'patron'));
    }

    function formatTutar(n) {
      if (n == null || isNaN(Number(n))) return '—';
      var x = Number(n);
      return (Math.round(x * 100) / 100).toLocaleString('tr-TR');
    }

    function escapeText(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function onayBadge(durum) {
      if (!durum) return '';
      var d = String(durum);
      var cls = 'badge-durum';
      if (d === 'Bekliyor') cls += ' is-wait';
      else if (d === 'Onaylandi') cls += ' is-ok';
      else if (d === 'Red') cls += ' is-err';
      return '<span class="' + cls + '">' + escapeText(d) + '</span>';
    }

    function setMsg(id, text, ok) {
      var el = document.getElementById(id);
      if (!el) return;
      el.hidden = !text;
      el.textContent = text || '';
      el.classList.toggle('is-ok', !!ok);
      el.classList.toggle('is-err', !ok);
    }

    function showLogin() {
      document.body.classList.add('is-login');
      loginView.hidden = false;
      appView.hidden = true;
      currentSession = null;
    }

    function showApp(session) {
      document.body.classList.remove('is-login');
      loginView.hidden = true;
      appView.hidden = false;
      currentSession = session || null;
      applyRoleUi(session);
      if (chipName) {
        chipName.textContent = (session && session.ad) || '—';
      }
      if (chipRole) {
        chipRole.textContent = rolMetni(session && session.rol);
      }
    }

    function applyRoleUi(session) {
      var patron = isPatron(session);
      var canWrite = !!(
        session &&
        (session.canWrite || session.canManageInvoices || patron ||
          session.rol === 'personel')
      );

      document.querySelectorAll('.tab-patron').forEach(function (btn) {
        btn.hidden = !patron;
      });

      document.querySelectorAll('.patron-only').forEach(function (el) {
        el.hidden = !patron;
      });

      if (metaAyar) metaAyar.hidden = !patron;
      if (ayarEl) {
        ayarEl.textContent = patron ? 'Açık (patron)' : 'Kapalı (personel)';
      }
      if (formFatura) formFatura.hidden = !canWrite;
      if (hintFatura) {
        hintFatura.textContent = canWrite
          ? 'Yeni fatura ekleyin. Personel kayıtları onay kuyruğuna düşer.'
          : 'Fatura eklemek için giriş yapın.';
      }

      var active = document.querySelector('.tab.is-active');
      if (active && active.hidden) {
        switchTab('ozet');
      }
      if (patron) refreshOnayBadge();
    }

    function fillLoginUsers(users) {
      if (!loginUser) return;
      var keep = loginUser.value;
      loginUser.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = 'Kullanıcı seçin';
      loginUser.appendChild(opt0);
      (users || []).forEach(function (u) {
        var opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.ad;
        loginUser.appendChild(opt);
      });
      if (keep) loginUser.value = keep;
    }

    function realSupplierRows(rows) {
      return (rows || []).filter(function (r) {
        return r && String(r.ad || '').trim() && r.aktif !== false;
      });
    }

    function fillSupplierSelects(rows) {
      var real = realSupplierRows(rows);
      supplierSelectIds.forEach(function (id) {
        var sel = document.getElementById(id);
        if (!sel) return;
        var prev = sel.value;
        var isAdmin = id === 'select-admin-tedarikci';
        sel.innerHTML = '';
        var opt0 = document.createElement('option');
        opt0.value = '';
        opt0.textContent = isAdmin ? 'Tümü' : 'Tedarikçi seçin';
        sel.appendChild(opt0);
        real.forEach(function (r) {
          var ad = String(r.ad).trim();
          var opt = document.createElement('option');
          opt.value = ad;
          opt.textContent = ad;
          sel.appendChild(opt);
        });
        if (prev) sel.value = prev;
      });
    }

    function fillExpenseCategories(categories) {
      var sel = document.getElementById('select-gider-kategori');
      if (!sel) return;
      var prev = sel.value;
      var list =
        categories && categories.length
          ? categories
          : [
              'Yemek', 'Mutfak', 'Temizlik', 'Market', 'Muhasebe',
              'Kira', 'Elektrik', 'Su', 'Diğer'
            ];
      sel.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = 'Kategori seçin';
      sel.appendChild(opt0);
      list.forEach(function (name) {
        if (!name) return;
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      if (prev) sel.value = prev;
    }

    function debtItemHtml(r) {
      var phone = r.telefon ? String(r.telefon).trim() : '';
      var actions = '';
      if (isPatron(currentSession) && r.row) {
        actions =
          '<div class="row-actions">' +
          '<button type="button" class="btn-sm" data-ted-edit="' +
          r.row +
          '">Düzenle</button> ' +
          '<button type="button" class="btn-sm btn-danger" data-ted-del="' +
          r.row +
          '" data-ted-ad="' +
          escapeText(r.ad || '') +
          '">Sil</button>' +
          '</div>';
      }
      return (
        '<div class="debt-row">' +
        '<strong>' +
        escapeText(r.ad || '') +
        '</strong>' +
        '<span class="borc-value">' +
        formatTutar(r.kalanBorc) +
        ' ₺</span>' +
        '</div>' +
        (phone ? '<div class="muted">' + escapeText(phone) + '</div>' : '') +
        actions
      );
    }

    function activityItemHtml(r) {
      return (
        '<strong>' +
        escapeText(r.tip || '') +
        '</strong> · ' +
        formatTutar(r.tutar) +
        ' ₺' +
        (r.kullanici ? ' · ' + escapeText(r.kullanici) : '') +
        ' ' +
        onayBadge(r.onayDurum) +
        '<div class="muted">' +
        escapeText(r.tarih || '') +
        ' · ' +
        escapeText(r.ozet || '') +
        '</div>'
      );
    }

    function gosterBorcOzeti(summary) {
      if (!summaryEl || !sumGelirEl || !sumGiderEl || !sumBorcEl) return;
      if (!summary) {
        summaryEl.hidden = true;
        if (listBorcOzet) listBorcOzet.hidden = true;
        return;
      }
      sumGelirEl.textContent = formatTutar(summary.gelirToplam);
      sumGiderEl.textContent = formatTutar(summary.giderToplam);
      sumBorcEl.textContent = formatTutar(summary.tedarikciBorcToplam);
      summaryEl.hidden = false;

      if (!listBorcOzet) return;
      var items = summary.tedarikciler || [];
      if (!items.length) {
        listBorcOzet.hidden = true;
        listBorcOzet.innerHTML = '';
        return;
      }
      listBorcOzet.hidden = false;
      renderList('list-borc-ozet', items, function (r) {
        var phone = r.telefon ? String(r.telefon).trim() : '';
        return (
          '<div class="debt-row">' +
          '<strong>' +
          escapeText(r.ad || '') +
          '</strong>' +
          '<span class="borc-value">' +
          formatTutar(r.kalanBorc) +
          ' ₺</span>' +
          '</div>' +
          (phone ? '<div class="muted">' + escapeText(phone) + '</div>' : '')
        );
      });
    }

    function gosterOzet(bilgi) {
      statusEl.textContent = bilgi.message || 'Merhaba';
      roleEl.textContent = rolMetni(bilgi.role);
      emailEl.textContent =
        (bilgi.userName || '') ||
        bilgi.userEmail ||
        '—';
      sheetEl.textContent = bilgi.usesActiveSpreadsheet
        ? 'Aktif test tablosu (ID zorunlu değil)'
        : bilgi.spreadsheetConfigured
          ? 'Tanımlı (test)'
          : 'Henüz yok (YOUR_SPREADSHEET_ID)';
      yazmaEl.textContent = bilgi.canWrite
        ? 'Açık (gelir / gider / ödeme / fatura)'
        : 'Kapalı (misafir)';
      if (ayarEl) {
        ayarEl.textContent = bilgi.canManage
          ? 'Açık (patron)'
          : 'Kapalı (personel)';
      }
      metaEl.hidden = false;
      applyRoleUi(
        bilgi.session || {
          canManage: !!bilgi.canManage,
          canManageInvoices: !!bilgi.canManageInvoices,
          canManageSuppliers: !!bilgi.canManageSuppliers,
          rol: bilgi.role,
          ad: bilgi.userName
        }
      );
      gosterBorcOzeti(bilgi.summary);
    }

    function hata(mesaj) {
      statusEl.textContent = mesaj || 'Panel bilgisi alınamadı.';
    }

    function switchTab(name) {
      tabs.forEach(function (btn) {
        var on = btn.getAttribute('data-tab') === name;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (key) {
        var el = panels[key];
        if (!el) return;
        if (key === name) {
          el.hidden = false;
          el.classList.add('is-active');
        } else {
          el.hidden = true;
          el.classList.remove('is-active');
        }
      });
      if (name === 'ozet') loadOzet();
      if (name === 'gelir') loadGelir();
      if (name === 'gider') loadGider();
      if (name === 'odeme') loadOdeme();
      if (name === 'fatura') loadFatura();
      if (name === 'profil') loadProfil();
      if (name === 'onay') loadOnay();
      if (name === 'tedarikci') loadTedarikci();
      if (name === 'yonetici') loadYonetici();
    }

    function loadOzet() {
      if (!hasGas()) return;
      google.script.run
        .withSuccessHandler(gosterOzet)
        .withFailureHandler(function () {
          hata('Özet yenilenemedi.');
        })
        .getPanelData();
    }

    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.hidden) return;
        switchTab(btn.getAttribute('data-tab'));
      });
    });

    function formValues(form) {
      var data = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name || el.type === 'file') return;
        data[el.name] = el.value;
      });
      return data;
    }

    function readFileAsDekont(fileInput, cb) {
      var file = fileInput && fileInput.files && fileInput.files[0];
      if (!file) {
        cb(null);
        return;
      }
      if (file.size > MAX_DEKONT) {
        cb({ error: 'Dosya en fazla ~5 MB olmalı.' });
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var result = String(reader.result || '');
        var comma = result.indexOf(',');
        var b64 = comma >= 0 ? result.slice(comma + 1) : result;
        cb({
          base64: b64,
          mimeType: file.type || 'application/octet-stream',
          fileName: file.name || 'dekont'
        });
      };
      reader.onerror = function () {
        cb({ error: 'Dosya okunamadı.' });
      };
      reader.readAsDataURL(file);
    }

    function uploadThen(payload, onOk, onFail) {
      if (!payload) {
        onOk({ fileId: '', url: '' });
        return;
      }
      if (payload.error) {
        onFail(payload.error);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            onFail((res && res.message) || 'Dekont yüklenemedi.');
            return;
          }
          onOk({ fileId: res.fileId || '', url: res.url || '' });
        })
        .withFailureHandler(function () {
          onFail('Dekont yüklenemedi.');
        })
        .uploadDekont(payload);
    }

    function renderList(ulId, items, mapper) {
      var ul = document.getElementById(ulId);
      if (!ul) return;
      ul.innerHTML = '';
      var list = items || [];
      if (ulId === 'list-tedarikci' || ulId === 'list-borc-ozet') {
        list = realSupplierRows(list);
      }
      if (!list.length) {
        var empty = document.createElement('li');
        empty.className = 'muted';
        empty.textContent = 'Kayıt yok veya sayfa kurulmadı.';
        ul.appendChild(empty);
        return;
      }
      list.forEach(function (item) {
        var html = mapper(item);
        if (!html || !String(html).replace(/<[^>]*>/g, '').trim()) {
          return;
        }
        var li = document.createElement('li');
        li.innerHTML = html;
        ul.appendChild(li);
      });
    }

    function loadGelir() {
      if (!hasGas()) {
        renderList('list-gelir', [], null);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg('msg-gelir', (res && res.message) || 'Gelir okunamadı.', false);
            renderList('list-gelir', [], null);
            return;
          }
          setMsg('msg-gelir', '', true);
          renderList('list-gelir', res.rows, function (r) {
            return (
              '<strong>' + formatTutar(r.tutar) + '</strong> · ' +
              escapeText(r.aciklama || '') +
              '<div class="muted">' +
              escapeText(r.tarih || '') +
              ' · ' +
              escapeText(r.kategori || '') +
              (r.kullanici ? ' · ' + escapeText(r.kullanici) : '') +
              '</div>'
            );
          });
        })
        .withFailureHandler(function () {
          setMsg('msg-gelir', 'Gelir listesi alınamadı.', false);
        })
        .listIncome({});
    }

    function loadGider() {
      if (!hasGas()) return;
      refreshExpenseCategories();
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg('msg-gider', (res && res.message) || 'Gider okunamadı.', false);
            renderList('list-gider', [], null);
            return;
          }
          setMsg('msg-gider', '', true);
          renderList('list-gider', res.rows, function (r) {
            return (
              '<strong>' + formatTutar(r.tutar) + '</strong> · ' +
              escapeText(r.aciklama || '') +
              '<div class="muted">' +
              escapeText(r.tarih || '') +
              (r.kategori ? ' · ' + escapeText(r.kategori) : '') +
              (r.kullanici ? ' · ' + escapeText(r.kullanici) : '') +
              '</div>'
            );
          });
        })
        .withFailureHandler(function () {
          setMsg('msg-gider', 'Gider listesi alınamadı.', false);
        })
        .listExpense({});
    }

    function refreshExpenseCategories() {
      if (!hasGas()) {
        fillExpenseCategories(null);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            fillExpenseCategories(res.categories || []);
          }
        })
        .withFailureHandler(function () {})
        .listExpenseCategories();
    }

    function loadOdeme() {
      if (!hasGas()) return;
      refreshSupplierOptions();
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg('msg-odeme', (res && res.message) || 'Ödeme okunamadı.', false);
            renderList('list-odeme', [], null);
            return;
          }
          setMsg('msg-odeme', '', true);
          renderList('list-odeme', res.rows, function (r) {
            var dekont = r.dekontUrl
              ? ' · <a href="' + escapeText(r.dekontUrl) + '" target="_blank" rel="noopener">Dekont</a>'
              : '';
            return (
              '<strong>' + formatTutar(r.tutar) + '</strong> · ' +
              escapeText(r.tedarikci || '') +
              ' ' +
              onayBadge(r.onayDurum) +
              '<div class="muted">' +
              escapeText(r.tarih || '') +
              (r.yontem ? ' · ' + escapeText(r.yontem) : '') +
              (r.yontem === 'Vadeli' ? ' (borç düşmez)' : '') +
              dekont +
              '</div>'
            );
          });
        })
        .withFailureHandler(function () {
          setMsg('msg-odeme', 'Ödeme listesi alınamadı.', false);
        })
        .listPayments({});
    }

    function loadFatura() {
      if (!hasGas()) return;
      refreshSupplierOptions();
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg('msg-fatura', (res && res.message) || 'Fatura okunamadı.', false);
            renderList('list-fatura', [], null);
            return;
          }
          setMsg('msg-fatura', '', true);
          renderList('list-fatura', res.rows, function (r) {
            var dekont = r.dekontUrl
              ? ' · <a href="' + escapeText(r.dekontUrl) + '" target="_blank" rel="noopener">Dekont</a>'
              : '';
            return (
              '<strong>' +
              escapeText(r.faturaNo || '') +
              '</strong> · ' +
              formatTutar(r.tutar) +
              ' ' +
              onayBadge(r.onayDurum) +
              '<div class="muted">' +
              escapeText(r.tarih || '') +
              ' · ' +
              escapeText(r.tedarikci || '') +
              (r.yontem ? ' · ' + escapeText(r.yontem) : '') +
              (r.durum ? ' · ' + escapeText(r.durum) : '') +
              dekont +
              '</div>'
            );
          });
        })
        .withFailureHandler(function () {
          setMsg('msg-fatura', 'Fatura listesi alınamadı.', false);
        })
        .listInvoices({});
    }

    function refreshSupplierOptions() {
      if (!hasGas()) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            fillSupplierSelects(res.rows || []);
          }
        })
        .withFailureHandler(function () {})
        .listSuppliers();
    }

    function resetTedarikciForm() {
      var form = document.getElementById('form-tedarikci');
      var row = document.getElementById('tedarikci-row');
      var title = document.getElementById('tedarikci-form-title');
      var btn = document.getElementById('btn-tedarikci-kaydet');
      var iptal = document.getElementById('btn-tedarikci-iptal');
      if (form) form.reset();
      if (row) row.value = '';
      if (title) title.textContent = 'Yeni tedarikçi';
      if (btn) btn.textContent = 'Tedarikçi ekle';
      if (iptal) iptal.hidden = true;
    }

    function loadTedarikci() {
      if (!hasGas()) return;
      if (!isPatron(currentSession)) {
        setMsg('msg-tedarikci', 'Tedarikçi yönetimi yalnız patron içindir.', false);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg(
              'msg-tedarikci',
              (res && res.message) || 'Tedarikçi okunamadı.',
              false
            );
            renderList('list-tedarikci', [], null);
            fillSupplierSelects([]);
            return;
          }
          setMsg('msg-tedarikci', '', true);
          fillSupplierSelects(res.rows || []);
          renderList('list-tedarikci', realSupplierRows(res.rows), debtItemHtml);
        })
        .withFailureHandler(function () {
          setMsg('msg-tedarikci', 'Tedarikçi listesi alınamadı.', false);
        })
        .listSuppliers();
    }

    var listTedEl = document.getElementById('list-tedarikci');
    if (listTedEl) {
      listTedEl.addEventListener('click', function (e) {
        var t = e.target;
        if (!t) return;
        var edit = t.getAttribute('data-ted-edit');
        var del = t.getAttribute('data-ted-del');
        if (edit) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (!res || !res.ok) return;
              var row = null;
              (res.rows || []).forEach(function (r) {
                if (String(r.row) === String(edit)) row = r;
              });
              if (!row) return;
              var form = document.getElementById('form-tedarikci');
              document.getElementById('tedarikci-row').value = row.row;
              form.ad.value = row.ad || '';
              form.telefon.value = row.telefon || '';
              form.not.value = row.not || '';
              document.getElementById('tedarikci-form-title').textContent =
                'Tedarikçi düzenle';
              document.getElementById('btn-tedarikci-kaydet').textContent =
                'Kaydet';
              document.getElementById('btn-tedarikci-iptal').hidden = false;
            })
            .listSuppliers();
        }
        if (del) {
          var ad = t.getAttribute('data-ted-ad') || 'bu tedarikçi';
          if (!window.confirm('“' + ad + '” pasifleştirilsin mi? (silme onayı)')) {
            return;
          }
          google.script.run
            .withSuccessHandler(function (res) {
              setMsg('msg-tedarikci', res.message || '', !!res.ok);
              if (res.ok) loadTedarikci();
            })
            .withFailureHandler(function () {
              setMsg('msg-tedarikci', 'Silinemedi.', false);
            })
            .deleteSupplier(del);
        }
      });
    }

    var btnTedIptal = document.getElementById('btn-tedarikci-iptal');
    if (btnTedIptal) {
      btnTedIptal.addEventListener('click', resetTedarikciForm);
    }

    function loadProfil() {
      if (!hasGas()) return;
      google.script.run

    function renderBarChart(elId, labels, values, title) {
      var el = document.getElementById(elId);
      if (!el) return;
      if (!labels || !labels.length) {
        el.innerHTML = '<p class="muted">' + escapeText(title) + ': veri yok</p>';
        return;
      }
      var max = 0;
      values.forEach(function (v) {
        if (v > max) max = v;
      });
      if (max <= 0) max = 1;
      var bars = '';
      for (var i = 0; i < labels.length; i++) {
        var h = Math.max(4, Math.round((values[i] / max) * 80));
        bars +=
          '<div class="chart-col">' +
          '<div class="chart-bar" style="height:' +
          h +
          'px" title="' +
          formatTutar(values[i]) +
          '"></div>' +
          '<span class="chart-label">' +
          escapeText(labels[i].replace(/^\d{4}-/, '')) +
          '</span>' +
          '</div>';
      }
      el.innerHTML =
        '<p class="chart-title">' +
        escapeText(title) +
        '</p><div class="chart-bars">' +
        bars +
        '</div>';
    }

    function loadYonetici() {

              setMsg('msg-admin-user', res.message || '', !!res.ok);

      formAdminUser.addEventListener('submit', function (e) {
        e.preventDefault();

        var data = formValues(formAdminUser);

        if (editId) {
          google.script.run
            .withSuccessHandler(function (res) {
              setMsg('msg-admin-user', res.message || '', !!res.ok);
              if (res.ok) {
                formAdminUser.reset();
                document.getElementById('user-edit-id').value = '';

          .withSuccessHandler(function (res) {

            function (dekont) {

              google.script.run

                    loadOdeme();

                .withFailureHandler(function () {
                  setMsg('msg-odeme', 'Ödeme eklenemedi.', false);

            function (err) {
              setMsg('msg-odeme', err, false);
            }

    var formLogin = document.getElementById('form-login');
    if (formLogin) {
      formLogin.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg(
            'msg-login',
            'Yalnızca Apps Script Web App içinde giriş yapılır.',
            false
          );
          return;
        }
        var userId = loginUser && loginUser.value;
        var code = loginCode && loginCode.value;
        if (!userId) {
          setMsg('msg-login', 'Kullanıcı seçin.', false);
          return;
        }
        if (btnLogin) btnLogin.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            if (btnLogin) btnLogin.disabled = false;
            if (!res || !res.ok) {
              setMsg(
                'msg-login',
                (res && res.message) || 'Giriş başarısız.',
                false
              );
              return;
            }
            setMsg('msg-login', res.message || 'Giriş başarılı.', true);
            if (loginCode) loginCode.value = '';
            showApp(res.session);
            switchTab('ozet');
          })
          .withFailureHandler(function () {
            if (btnLogin) btnLogin.disabled = false;

          })
          .login(userId, code);
      });

    var btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
      btnLogout.addEventListener('click', function () {
        if (!hasGas()) {
          showLogin();

        }
        google.script.run
          .withSuccessHandler(function () {
            showLogin();
            setMsg('msg-login', 'Çıkış yapıldı.', true);
            loadLoginUsers();
          })
          .withFailureHandler(function () {
            showLogin();
          })
          .logout();
      });
    }

    var btnForgot = document.getElementById('btn-forgot');
    if (btnForgot) {
      btnForgot.addEventListener('click', function () {
        setMsg(
          'msg-login',
          'Test ortamı: kodlar Config.TEST_USERS / Kullanicilar (ör. Fatih TEST4567, Sercan TEST2345). Canlı şifre yok.',
          true
        );
      });
    }

    function loadLoginUsers() {
      if (!hasGas()) {
        fillLoginUsers([
          { id: 'test-yalcin', ad: 'Yalçın Özeke' },
          { id: 'test-sercan', ad: 'Sercan Toprak' },
          { id: 'test-aleyna', ad: 'Aleyna Toprak' },
          { id: 'test-fatih', ad: 'Fatih Toprak' }
        ]);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            fillLoginUsers(res.users || []);
          }
        })
        .withFailureHandler(function () {
          setMsg('msg-login', 'Kullanıcı listesi alınamadı.', false);
        })
        .listUsersForLogin();
    }

    function boot() {
      loadLoginUsers();
      if (!hasGas()) {
        showLogin();
        setMsg(
          'msg-login',
          'Önizleme: Apps Script Web App’te giriş çalışır.',
          true
        );
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.loggedIn && res.session) {
            showApp(res.session);
            switchTab('ozet');
          } else {
            showLogin();
          }
        })
        .withFailureHandler(function () {
          showLogin();
        })
        .getSession();
    }

    boot();
  })();
</script>
