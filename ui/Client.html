<script>
  (function () {
    var loginView = document.getElementById('login-view');
    var appView = document.getElementById('app-view');
    var statusEl = document.getElementById('status');
    var metaEl = document.getElementById('meta');
    var roleEl = document.getElementById('role');
    var emailEl = document.getElementById('email');
    var sheetEl = document.getElementById('sheet');
    var yazmaEl = document.getElementById('yazma');
    var ayarEl = document.getElementById('ayar');
    var metaAyar = document.getElementById('meta-ayar');
    var summaryEl = document.getElementById('summary-totals');
    var sumGelirEl = document.getElementById('sum-gelir');
    var sumGiderEl = document.getElementById('sum-gider');
    var sumBorcEl = document.getElementById('sum-borc');
    var listBorcOzet = document.getElementById('list-borc-ozet');
    var chipName = document.getElementById('chip-name');
    var chipRole = document.getElementById('chip-role');
    var loginUser = document.getElementById('login-user');
    var loginCode = document.getElementById('login-code');
    var btnLogin = document.getElementById('btn-login');
    var formFatura = document.getElementById('form-fatura');
    var hintFatura = document.getElementById('hint-fatura');
    var currentSession = null;
    var onayFiltre = 'Bekliyor';
    var MAX_DEKONT = 5 * 1024 * 1024;
    var tabs = document.querySelectorAll('.tab');
    var panels = {
      ozet: document.getElementById('panel-ozet'),
      gelir: document.getElementById('panel-gelir'),
      gider: document.getElementById('panel-gider'),
      odeme: document.getElementById('panel-odeme'),
      fatura: document.getElementById('panel-fatura'),
      profil: document.getElementById('panel-profil'),
      onay: document.getElementById('panel-onay'),
      tedarikci: document.getElementById('panel-tedarikci'),
      yonetici: document.getElementById('panel-yonetici'),
      haftalik: document.getElementById('panel-haftalik'),
      ayarlar: document.getElementById('panel-ayarlar')
    };
    var tabNav = document.getElementById('tab-nav');
    var navToggle = document.getElementById('nav-toggle');
    var supplierSelectIds = [
      'select-fatura-tedarikci',
      'select-odeme-tedarikci',
      'select-admin-tedarikci'
    ];

    function hasGas() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function rolMetni(rol) {
      if (rol === 'patron') return 'Patron';
      if (rol === 'personel') return 'Personel';
      return 'Misafir';
    }

    function isPatron(session) {
      return !!(session && (session.canManage || session.rol === 'patron'));
    }

    function formatTutar(n) {
      if (n == null || isNaN(Number(n))) return '—';
      var x = Number(n);
      return (Math.round(x * 100) / 100).toLocaleString('tr-TR');
    }

    function escapeText(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** Yalnız http(s) veya /uploads/ — javascript: vb. href engeli */
    function safeHref(url) {
      var u = String(url == null ? '' : url).trim();
      if (!u) return '';
      if (/^https?:\/\//i.test(u)) return u;
      if (u.indexOf('/uploads/') === 0) return u;
      return '';
    }

    /**
     * Çift gönderim koruması: submit sırasında butonu kilitler.
     * @param {HTMLFormElement} form
     * @param {function(function(): void): void} run — run(done) çağırır; done kilidi açar
     */
    function withFormBusy(form, run) {
      if (!form) return;
      if (form.getAttribute('data-busy') === '1') return;
      form.setAttribute('data-busy', '1');
      var btn = form.querySelector('button[type="submit"]');
      var prevDisabled = btn ? btn.disabled : false;
      if (btn) btn.disabled = true;
      function done() {
        form.removeAttribute('data-busy');
        if (btn) btn.disabled = prevDisabled;
      }
      try {
        run(done);
      } catch (err) {
        done();
        throw err;
      }
    }

    function onayBadge(durum) {
      if (!durum) return '';
      var d = String(durum);
      var cls = 'badge-durum';
      if (d === 'Bekliyor') cls += ' is-wait';
      else if (d === 'Onaylandi') cls += ' is-ok';
      else if (d === 'Red') cls += ' is-err';
      return '<span class="' + cls + '">' + escapeText(d) + '</span>';
    }

    function setMsg(id, text, ok) {
      var el = document.getElementById(id);
      if (!el) return;
      el.hidden = !text;
      el.textContent = text || '';
      el.classList.toggle('is-ok', !!ok);
      el.classList.toggle('is-err', !ok);
    }

    var SERVER_UNREACHABLE =
      'Sunucuya erişilemiyor. Lütfen yöneticiye bildirin.';
    var ONBOARD_KEY_PREFIX = 'aqua_tekel_onboard_v1_';
    var connToast = document.getElementById('conn-toast');
    var connToastText = document.getElementById('conn-toast-text');
    var connToastClose = document.getElementById('conn-toast-close');
    var onboardOverlay = document.getElementById('onboard-overlay');
    var connToastTimer = null;
    var offlineToastShown = false;

    function showServerUnreachable() {
      if (connToastText) {
        connToastText.textContent = SERVER_UNREACHABLE;
      }
      if (connToast) connToast.hidden = false;
      if (connToastTimer) clearTimeout(connToastTimer);
      connToastTimer = setTimeout(function () {
        if (connToast) connToast.hidden = true;
      }, 9000);
    }

    function hideConnToast() {
      if (connToastTimer) clearTimeout(connToastTimer);
      if (connToast) connToast.hidden = true;
    }

    /** google.script.run / fetch hata yakalayıcı — sessiz bırakma. */
    function rpcFail(msgId, extra) {
      return function () {
        showServerUnreachable();
        if (msgId) setMsg(msgId, SERVER_UNREACHABLE, false);
        if (typeof extra === 'function') {
          try {
            extra.apply(null, arguments);
          } catch (e) {
            /* yoksay */
          }
        }
      };
    }

    function requireGas(msgId) {
      if (hasGas()) return true;
      showServerUnreachable();
      if (msgId) setMsg(msgId, SERVER_UNREACHABLE, false);
      return false;
    }

    window.__aquaRpcFail = showServerUnreachable;

    function onboardStorageKey(userId) {
      return ONBOARD_KEY_PREFIX + String(userId || '');
    }

    function hasSeenOnboarding(userId) {
      if (!userId) return true;
      try {
        return localStorage.getItem(onboardStorageKey(userId)) === '1';
      } catch (e) {
        return true;
      }
    }

    function markOnboardingDone(userId) {
      if (!userId) return;
      try {
        localStorage.setItem(onboardStorageKey(userId), '1');
      } catch (e) {
        /* yoksay */
      }
    }

    function fillOnboarding(session) {
      var patron = isPatron(session);
      var lead = document.getElementById('onboard-lead');
      var steps = document.querySelectorAll('#onboard-steps li');
      if (lead) {
        lead.textContent = patron
          ? 'Patron hesabınız için üç kısa adım.'
          : 'Personel hesabınız için üç kısa adım.';
      }
      var texts = patron
        ? [
            'Gelir, gider, ödeme veya fatura ekleyin — günlük işlem sekmelerinden.',
            'Personel kayıtlarını Onay sekmesinde inceleyin; onaylayın veya reddedin.',
            'Yönetici ve Haftalık Özet ile firma, tarih ve Pazartesi brifingini takip edin.'
          ]
        : [
            'Gelir, gider, ödeme veya fatura ekleyin — kayıtlarınız onaya düşebilir.',
            'Profil sekmesinde kendi son işlemlerinizi ve onay durumunu görün.',
            'Tedarikçi / yönetici sekmeleri yalnız patron içindir; günlük işiniz bu panelde.'
          ];
      for (var i = 0; i < steps.length; i++) {
        steps[i].textContent = texts[i] || '';
      }
    }

    function dismissOnboarding() {
      if (onboardOverlay) onboardOverlay.hidden = true;
      if (currentSession && currentSession.id) {
        markOnboardingDone(currentSession.id);
      }
    }

    function maybeShowOnboarding(session) {
      if (!session || !session.id) return;
      if (hasSeenOnboarding(session.id)) return;
      fillOnboarding(session);
      if (onboardOverlay) onboardOverlay.hidden = false;
    }

    if (connToastClose) {
      connToastClose.addEventListener('click', hideConnToast);
    }
    var onboardOk = document.getElementById('onboard-ok');
    var onboardSkip = document.getElementById('onboard-skip');
    if (onboardOk) onboardOk.addEventListener('click', dismissOnboarding);
    if (onboardSkip) onboardSkip.addEventListener('click', dismissOnboarding);

    window.addEventListener('offline', function () {
      if (offlineToastShown) return;
      offlineToastShown = true;
      showServerUnreachable();
    });
    window.addEventListener('online', function () {
      offlineToastShown = false;
    });

    function closeMobileNav() {
      if (tabNav) tabNav.classList.remove('is-open');
      if (navToggle) navToggle.setAttribute('aria-expanded', 'false');
    }

    function showLogin() {
      document.body.classList.add('is-login');
      loginView.hidden = false;
      appView.hidden = true;
      currentSession = null;
      closeMobileNav();
      if (navToggle) navToggle.hidden = true;
    }

    function showApp(session) {
      document.body.classList.remove('is-login');
      loginView.hidden = true;
      appView.hidden = false;
      currentSession = session || null;
      applyRoleUi(session);
      if (chipName) {
        chipName.textContent = (session && session.ad) || '—';
      }
      if (chipRole) {
        chipRole.textContent = rolMetni(session && session.rol);
      }
      if (navToggle) navToggle.hidden = false;
      closeMobileNav();
      maybeShowOnboarding(session);
    }

    function applyRoleUi(session) {
      var patron = isPatron(session);
      var canWrite = !!(
        session &&
        (session.canWrite || session.canManageInvoices || patron ||
          session.rol === 'personel')
      );

      document.querySelectorAll('.tab-patron').forEach(function (btn) {
        btn.hidden = !patron;
      });

      document.querySelectorAll('.patron-only').forEach(function (el) {
        el.hidden = !patron;
      });

      if (metaAyar) metaAyar.hidden = !patron;
      if (ayarEl) {
        ayarEl.textContent = patron ? 'Açık (patron)' : 'Kapalı (personel)';
      }
      if (formFatura) formFatura.hidden = !canWrite;
      if (hintFatura) {
        hintFatura.textContent = canWrite
          ? 'Yeni fatura ekleyin. Personel kayıtları onay kuyruğuna düşer.'
          : 'Fatura eklemek için giriş yapın.';
      }

      var active = document.querySelector('.tab.is-active');
      if (active && active.hidden) {
        switchTab('ozet');
      }
      if (patron) refreshOnayBadge();
    }

    function fillLoginUsers(users) {
      if (!loginUser) return;
      var keep = loginUser.value;
      loginUser.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = 'Kullanıcı seçin';
      loginUser.appendChild(opt0);
      (users || []).forEach(function (u) {
        var opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.ad;
        loginUser.appendChild(opt);
      });
      if (keep) loginUser.value = keep;
    }

    function realSupplierRows(rows) {
      return (rows || []).filter(function (r) {
        return r && String(r.ad || '').trim() && r.aktif !== false;
      });
    }

    function fillSupplierSelects(rows) {
      var real = realSupplierRows(rows);
      supplierSelectIds.forEach(function (id) {
        var sel = document.getElementById(id);
        if (!sel) return;
        var prev = sel.value;
        var isAdmin = id === 'select-admin-tedarikci';
        sel.innerHTML = '';
        var opt0 = document.createElement('option');
        opt0.value = '';
        opt0.textContent = isAdmin ? 'Tümü' : 'Tedarikçi seçin';
        sel.appendChild(opt0);
        real.forEach(function (r) {
          var ad = String(r.ad).trim();
          var opt = document.createElement('option');
          opt.value = ad;
          opt.textContent = ad;
          sel.appendChild(opt);
        });
        if (prev) sel.value = prev;
      });
    }

    function fillExpenseCategories(categories) {
      var sel = document.getElementById('select-gider-kategori');
      if (!sel) return;
      var prev = sel.value;
      var list =
        categories && categories.length
          ? categories
          : [
              'Yemek', 'Mutfak', 'Temizlik', 'Market', 'Muhasebe',
              'Kira', 'Elektrik', 'Su', 'Diğer'
            ];
      sel.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = 'Kategori seçin';
      sel.appendChild(opt0);
      list.forEach(function (name) {
        if (!name) return;
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      if (prev) sel.value = prev;
    }

    function debtItemHtml(r) {
      var phone = r.telefon ? String(r.telefon).trim() : '';
      var actions = '';
      if (isPatron(currentSession) && r.row) {
        actions =
          '<div class="row-actions">' +
          '<button type="button" class="btn-sm" data-ted-edit="' +
          r.row +
          '">Düzenle</button> ' +
          '<button type="button" class="btn-sm btn-danger" data-ted-del="' +
          r.row +
          '" data-ted-ad="' +
          escapeText(r.ad || '') +
          '">Sil</button>' +
          '</div>';
      }
      return (
        '<div class="debt-row">' +
        '<strong>' +
        escapeText(r.ad || '') +
        '</strong>' +
        '<span class="borc-value">' +
        formatTutar(r.kalanBorc) +
        ' ₺</span>' +
        '</div>' +
        (phone ? '<div class="muted">' + escapeText(phone) + '</div>' : '') +
        actions
      );
    }

    function activityItemHtml(r) {
      return (
        '<strong>' +
        escapeText(r.tip || '') +
        '</strong> · ' +
        formatTutar(r.tutar) +
        ' ₺' +
        (r.kullanici ? ' · ' + escapeText(r.kullanici) : '') +
        ' ' +
        onayBadge(r.onayDurum) +
        '<div class="muted">' +
        escapeText(r.tarih || '') +
        ' · ' +
        escapeText(r.ozet || '') +
        '</div>'
      );
    }

    function gosterBorcOzeti(summary) {
      if (!summaryEl || !sumGelirEl || !sumGiderEl || !sumBorcEl) return;
      if (!summary) {
        summaryEl.hidden = true;
        if (listBorcOzet) listBorcOzet.hidden = true;
        return;
      }
      sumGelirEl.textContent = formatTutar(summary.gelirToplam);
      sumGiderEl.textContent = formatTutar(summary.giderToplam);
      sumBorcEl.textContent = formatTutar(summary.tedarikciBorcToplam);
      summaryEl.hidden = false;

      if (!listBorcOzet) return;
      var items = summary.tedarikciler || [];
      listBorcOzet.hidden = false;
      renderList('list-borc-ozet', items, function (r) {
        var phone = r.telefon ? String(r.telefon).trim() : '';
        return (
          '<div class="debt-row">' +
          '<strong>' +
          escapeText(r.ad || '') +
          '</strong>' +
          '<span class="borc-value">' +
          formatTutar(r.kalanBorc) +
          ' ₺</span>' +
          '</div>' +
          (phone ? '<div class="muted">' + escapeText(phone) + '</div>' : '')
        );
      });
    }

    function gosterOzet(bilgi) {
      statusEl.textContent = bilgi.message || 'Merhaba';
      roleEl.textContent = rolMetni(bilgi.role);
      emailEl.textContent =
        (bilgi.userName || '') ||
        bilgi.userEmail ||
        '—';
      sheetEl.textContent = bilgi.usesActiveSpreadsheet
        ? 'Aktif test tablosu (ID zorunlu değil)'
        : bilgi.spreadsheetConfigured
          ? 'Tanımlı (test)'
          : 'Henüz yok (YOUR_SPREADSHEET_ID)';
      yazmaEl.textContent = bilgi.canWrite
        ? 'Açık (gelir / gider / ödeme / fatura)'
        : 'Kapalı (misafir)';
      if (ayarEl) {
        ayarEl.textContent = bilgi.canManage
          ? 'Açık (patron)'
          : 'Kapalı (personel)';
      }
      metaEl.hidden = false;
      applyRoleUi(
        bilgi.session || {
          canManage: !!bilgi.canManage,
          canManageInvoices: !!bilgi.canManageInvoices,
          canManageSuppliers: !!bilgi.canManageSuppliers,
          rol: bilgi.role,
          ad: bilgi.userName
        }
      );
      gosterBorcOzeti(bilgi.summary);
      if (bilgi.summary && bilgi.summary.ok === false && bilgi.summary.message) {
        statusEl.textContent =
          (bilgi.message || 'Merhaba') + ' — ' + bilgi.summary.message;
      }
    }

    function hata(mesaj) {
      statusEl.textContent = mesaj || 'Panel bilgisi alınamadı.';
    }

    function switchTab(name) {
      tabs.forEach(function (btn) {
        var on = btn.getAttribute('data-tab') === name;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (key) {
        var el = panels[key];
        if (!el) return;
        if (key === name) {
          el.hidden = false;
          el.classList.add('is-active');
        } else {
          el.hidden = true;
          el.classList.remove('is-active');
        }
      });
      closeMobileNav();
      if (name === 'ozet') loadOzet();
      if (name === 'gelir') loadGelir();
      if (name === 'gider') loadGider();
      if (name === 'odeme') loadOdeme();
      if (name === 'fatura') loadFatura();
      if (name === 'profil') loadProfil();
      if (name === 'onay') loadOnay();
      if (name === 'tedarikci') loadTedarikci();
      if (name === 'yonetici') loadYonetici();
      if (name === 'haftalik') loadHaftalik();
    }

    function loadOzet() {
      if (!hasGas()) return;
      google.script.run
        .withSuccessHandler(gosterOzet)
        .withFailureHandler(rpcFail(null, function () { hata(SERVER_UNREACHABLE); }))
        .getPanelData();
    }

    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.hidden) return;
        switchTab(btn.getAttribute('data-tab'));
      });
    });

    if (navToggle && tabNav) {
      navToggle.addEventListener('click', function () {
        var open = !tabNav.classList.contains('is-open');
        tabNav.classList.toggle('is-open', open);
        navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    function formValues(form) {
      var data = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name || el.type === 'file') return;
        data[el.name] = el.value;
      });
      return data;
    }

    function readFileAsDekont(fileInput, cb) {
      var file = fileInput && fileInput.files && fileInput.files[0];
      if (!file) {
        cb(null);
        return;
      }
      if (file.size > MAX_DEKONT) {
        cb({ error: 'Dosya en fazla ~5 MB olmalı.' });
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var result = String(reader.result || '');
        var comma = result.indexOf(',');
        var b64 = comma >= 0 ? result.slice(comma + 1) : result;
        cb({
          base64: b64,
          mimeType: file.type || 'application/octet-stream',
          fileName: file.name || 'dekont'
        });
      };
      reader.onerror = function () {
        cb({ error: 'Dosya okunamadı.' });
      };
      reader.readAsDataURL(file);
    }

    function uploadThen(payload, onOk, onFail) {
      if (!payload) {
        onOk({ fileId: '', url: '' });
        return;
      }
      if (payload.error) {
        onFail(payload.error);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            onFail((res && res.message) || 'Dekont yüklenemedi.');
            return;
          }
          onOk({ fileId: res.fileId || '', url: res.url || '' });
        })
        .withFailureHandler(rpcFail(null, function () { onFail(SERVER_UNREACHABLE); }))
        .uploadDekont(payload);
    }

    var EMPTY_LIST_MSG = {
      'list-gelir': 'Henüz gelir kaydı yok.',
      'list-gider': 'Henüz gider kaydı yok.',
      'list-odeme': 'Henüz ödeme kaydı yok.',
      'list-fatura': 'Henüz fatura kaydı yok.',
      'list-profil': 'Bu kullanıcıya ait işlem yok.',
      'list-onay': 'Bekleyen onay yok.',
      'list-tedarikci': 'Aktif tedarikçi yok. Aşağıdan ekleyebilirsiniz.',
      'list-borc-ozet': 'Gösterilecek tedarikçi borcu yok.',
      'list-admin-filtre': 'Filtreye uyan kayıt yok.',
      'list-admin-aktivite': 'Henüz aktivite yok.',
      'list-admin-users': 'Kullanıcı listesi boş.',
      'list-digest-firm': 'Bu dönemde firma ödemesi yok.',
      'list-digest-giris': 'Bu dönemde giriş kaydı yok.'
    };

    function renderList(ulId, items, mapper) {
      var ul = document.getElementById(ulId);
      if (!ul) return;
      ul.innerHTML = '';
      var list = items || [];
      if (ulId === 'list-tedarikci' || ulId === 'list-borc-ozet') {
        list = realSupplierRows(list);
      }
      if (!list.length) {
        var empty = document.createElement('li');
        empty.className = 'list-empty muted';
        empty.textContent = EMPTY_LIST_MSG[ulId] || 'Henüz kayıt yok.';
        ul.appendChild(empty);
        return;
      }
      if (!mapper) {
        var noMap = document.createElement('li');
        noMap.className = 'list-empty muted';
        noMap.textContent = EMPTY_LIST_MSG[ulId] || 'Henüz kayıt yok.';
        ul.appendChild(noMap);
        return;
      }
      var added = 0;
      list.forEach(function (item) {
        var html = mapper(item);
        if (!html || !String(html).replace(/<[^>]*>/g, '').trim()) {
          return;
        }
        var li = document.createElement('li');
        li.innerHTML = html;
        ul.appendChild(li);
        added += 1;
      });
      if (!added) {
        var none = document.createElement('li');
        none.className = 'list-empty muted';
        none.textContent = EMPTY_LIST_MSG[ulId] || 'Henüz kayıt yok.';
        ul.appendChild(none);
      }
    }

    function loadGelir() {
      if (!hasGas()) {
        renderList('list-gelir', [], null);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            setMsg('msg-gelir', (res && res.message) || 'Gelir okunamadı.', false);
            renderList('list-gelir', [], null);
            return;
          }
          setMsg('msg-gelir', '', true);
          renderList('list-gelir', res.rows, function (r) {
            return (
              '<strong>' + formatTutar(r.tutar) + '</strong> · ' +
              escapeText(r.aciklama || '') +
              '<div class="muted">' +
              escapeText(r.tarih || '') +
              ' · ' +
              escapeText(r.kategori || '') +
              (r.kullanici ? ' · ' + escapeText(r.kullanici) : '') +
              '</div>'
            );
          });
        })

    function renderBarChart(elId, labels, values, title) {
      var el = document.getElementById(elId);
      if (!el) return;
      if (!labels || !labels.length) {
        el.innerHTML = '<p class="muted">' + escapeText(title) + ': veri yok</p>';
        return;
      }
      var max = 0;
      values.forEach(function (v) {
        if (v > max) max = v;
      });
      if (max <= 0) max = 1;
      var bars = '';
      for (var i = 0; i < labels.length; i++) {
        var h = Math.max(4, Math.round((values[i] / max) * 80));
        bars +=
          '<div class="chart-col">' +
          '<div class="chart-bar" style="height:' +
          h +
          'px" title="' +
          formatTutar(values[i]) +
          '"></div>' +
          '<span class="chart-label">' +
          escapeText(labels[i].replace(/^\d{4}-/, '')) +
          '</span>' +
          '</div>';
      }
      el.innerHTML =
        '<p class="chart-title">' +
        escapeText(title) +
        '</p><div class="chart-bars">' +
        bars +
        '</div>';
    }

    function parseTrDate(s) {
      var m = String(s || '').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      if (!m) return null;
      var d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      if (
        d.getFullYear() !== Number(m[3]) ||
        d.getMonth() !== Number(m[2]) - 1 ||
        d.getDate() !== Number(m[1])

        displayId: 'admin-bitis-display'
      }
    };

    function syncAdminDateDisplay(key) {
      var state = adminDatePickers[key];
      if (!state) return;
      var input = document.getElementById(state.inputId);
      var display = document.getElementById(state.displayId);
      var clearBtn = document.querySelector(
        '.date-picker-clear[data-clear="' + key + '"]'
      );
      if (input) input.value = state.value || '';
      if (display) {
        if (state.value) {
          display.textContent = state.value;
          display.classList.remove('is-empty');
        } else {
          display.textContent = 'Tarih seçin';
          display.classList.add('is-empty');
        }
      }
      if (clearBtn) clearBtn.hidden = !state.value;
    }

    function renderAdminCalendar(key) {
      var state = adminDatePickers[key];
      var root = document.getElementById(state.calId);
      if (!root || !state) return;

      var y = state.viewYear;
      var m = state.viewMonth;
      var selected = parseTrDate(state.value);
      var today = new Date();
      var first = new Date(y, m, 1);
      var startPad = mondayIndex(first.getDay());
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var prevDays = new Date(y, m, 0).getDate();

      var html =
        '<div class="date-cal-nav">' +
        '<button type="button" class="date-cal-nav-btn" data-nav="prev" aria-label="Önceki ay">‹</button>' +
        '<p class="date-cal-title">' +
        escapeText(TR_AYLAR[m] + ' ' + y) +
        '</p>' +
        '<button type="button" class="date-cal-nav-btn" data-nav="next" aria-label="Sonraki ay">›</button>' +
        '</div>' +
        '<table class="date-cal-table" role="grid">' +
        '<thead><tr>';
      var di;
      for (di = 0; di < TR_GUNLER.length; di++) {
        html += '<th scope="col">' + TR_GUNLER[di] + '</th>';
      }
      html += '</tr></thead><tbody>';

      var cell = 0;
      var dayNum = 1;
      var nextDay = 1;
      var week;
      var dow;
      for (week = 0; week < 6; week++) {
        html += '<tr>';
        for (dow = 0; dow < 7; dow++) {
          var label;
          var isoDay;
          var isoMonth;
          var isoYear;
          var classes = 'date-cal-day';
          var disabled = false;

          if (cell < startPad) {
            label = prevDays - startPad + cell + 1;
            isoMonth = m === 0 ? 11 : m - 1;
            isoYear = m === 0 ? y - 1 : y;
            isoDay = label;
            classes += ' is-outside';
            disabled = true;
          } else if (dayNum > daysInMonth) {
            label = nextDay++;
            isoMonth = m === 11 ? 0 : m + 1;
            isoYear = m === 11 ? y + 1 : y;
            isoDay = label;
            classes += ' is-outside';
            disabled = true;
          } else {
            label = dayNum;
            isoDay = dayNum;
            isoMonth = m;
            isoYear = y;
            if (
              today.getFullYear() === y &&
              today.getMonth() === m &&
              today.getDate() === dayNum
            ) {
              classes += ' is-today';
            }
            if (
              selected &&
              selected.getFullYear() === y &&
              selected.getMonth() === m &&
              selected.getDate() === dayNum
            ) {
              classes += ' is-selected';
            }
            dayNum++;
          }

          var valueStr =
            pad2(isoDay) + '.' + pad2(isoMonth + 1) + '.' + isoYear;
          html += '<td>';
          if (disabled) {
            html +=
              '<span class="' +
              classes +
              '" aria-hidden="true">' +
              label +
              '</span>';
          } else {
            html +=
              '<button type="button" class="' +
              classes +
              '" data-date="' +
              valueStr +
              '" aria-label="' +
              escapeText(valueStr) +
              '"' +
              (classes.indexOf('is-selected') >= 0
                ? ' aria-pressed="true"'
                : ' aria-pressed="false"') +
              '>' +
              label +
              '</button>';
          }
          html += '</td>';
          cell++;
        }
        html += '</tr>';
        if (dayNum > daysInMonth && week >= 3) break;
      }
      html += '</tbody></table>';
      root.innerHTML = html;
    }

    function setAdminDateValue(key, valueStr) {
      var state = adminDatePickers[key];
      if (!state) return;
      state.value = valueStr || '';
      if (valueStr) {
        var d = parseTrDate(valueStr);
        if (d) {
          state.viewYear = d.getFullYear();
          state.viewMonth = d.getMonth();
        }
      }
      syncAdminDateDisplay(key);
      renderAdminCalendar(key);
    }

    function initAdminDatePickers() {
      var key;
      for (key in adminDatePickers) {
        if (!adminDatePickers.hasOwnProperty(key)) continue;
        syncAdminDateDisplay(key);
        renderAdminCalendar(key);
      }

      var form = document.getElementById('form-admin-filtre');
      if (!form || form.getAttribute('data-date-bound') === '1') return;
      form.setAttribute('data-date-bound', '1');

      form.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;

        var clearBtn = t.closest('.date-picker-clear');
        if (clearBtn) {
          e.preventDefault();
          setAdminDateValue(clearBtn.getAttribute('data-clear'), '');
          return;
        }

        var navBtn = t.closest('.date-cal-nav-btn');
        if (navBtn) {
          e.preventDefault();
          var picker = navBtn.closest('[data-admin-date]');
          if (!picker) return;
          var navKey = picker.getAttribute('data-admin-date');
          var navState = adminDatePickers[navKey];
          if (!navState) return;
          if (navBtn.getAttribute('data-nav') === 'prev') {
            navState.viewMonth -= 1;
            if (navState.viewMonth < 0) {
              navState.viewMonth = 11;
              navState.viewYear -= 1;
            }
          } else {
            navState.viewMonth += 1;
            if (navState.viewMonth > 11) {
              navState.viewMonth = 0;
              navState.viewYear += 1;
            }
          }
          renderAdminCalendar(navKey);
          return;
        }

        var dayBtn = t.closest('.date-cal-day[data-date]');
        if (dayBtn) {
          e.preventDefault();
          var dayPicker = dayBtn.closest('[data-admin-date]');
          if (!dayPicker) return;
          setAdminDateValue(
            dayPicker.getAttribute('data-admin-date'),
            dayBtn.getAttribute('data-date')
          );
        }
      });
    }

    initAdminDatePickers();

    var formAdminFiltre = document.getElementById('form-admin-filtre');
    if (formAdminFiltre) {
      formAdminFiltre.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) return;
        var data = formValues(formAdminFiltre);
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.ok) {
              setMsg(
                'msg-admin-filtre',
                (res && res.message) || 'Filtre başarısız.',
                false
              );
              return;
            }
            setMsg('msg-admin-filtre', 'Filtre uygulandı.', true);
            var items = [];
            (res.faturalar || []).forEach(function (r) {
              items.push({
                tip: 'fatura',
                tarih: r.tarih,
                tutar: r.tutar,
                ozet: (r.faturaNo || '') + ' · ' + (r.tedarikci || ''),
                kullanici: r.kullanici || '',
                onayDurum: r.onayDurum || ''
              });
            });
            (res.odemeler || []).forEach(function (r) {
              items.push({
                tip: 'odeme',
                tarih: r.tarih,
                tutar: r.tutar,
                ozet: (r.tedarikci || '') + ' · ' + (r.yontem || ''),
                kullanici: r.kullanici || '',
                onayDurum: r.onayDurum || ''
              });
            });
            (res.gelirler || []).forEach(function (r) {
              items.push({
                tip: 'gelir',
                tarih: r.tarih,
                tutar: r.tutar,
                ozet: r.aciklama || '',
                kullanici: r.kullanici || '',
                onayDurum: ''
              });
            });
            (res.giderler || []).forEach(function (r) {
              items.push({
                tip: 'gider',
                tarih: r.tarih,
                tutar: r.tutar,
                ozet: (r.aciklama || '') + (r.kategori ? ' · ' + r.kategori : ''),
                kullanici: r.kullanici || '',
                onayDurum: ''
              });
            });
            renderList('list-admin-filtre', items, activityItemHtml);
          })
          .withFailureHandler(rpcFail('msg-admin-filtre'))
          .getAdminFilteredReport(data);
      });
    }

    var formGelir = document.getElementById('form-gelir');
    if (formGelir) {
      formGelir.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg('msg-gelir', 'Kayıt için sunucu bağlantısı gerekli.', false);
          return;
        }
        withFormBusy(formGelir, function (done) {
          var kayit = formValues(formGelir);
          google.script.run
            .withSuccessHandler(function (res) {
              done();
              setMsg('msg-gelir', res.message || '', !!res.ok);
              if (res.ok) {
                formGelir.reset();
                loadGelir();
              }
            })
            .withFailureHandler(rpcFail('msg-gelir', done))
            .addIncome(kayit);
        });
      });
    }

    var formGider = document.getElementById('form-gider');
    if (formGider) {
      formGider.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg('msg-gider', 'Kayıt için sunucu bağlantısı gerekli.', false);
          return;
        }
        var kayit = formValues(formGider);
        if (!kayit.kategori) {
          setMsg('msg-gider', 'Kategori seçin.', false);
          return;
        }
        withFormBusy(formGider, function (done) {
          google.script.run
            .withSuccessHandler(function (res) {
              done();
              setMsg('msg-gider', res.message || '', !!res.ok);
              if (res.ok) {
                formGider.reset();
                loadGider();
              }
            })
            .withFailureHandler(rpcFail('msg-gider', done))
            .addExpense(kayit);
        });
      });
    }

    var formTed = document.getElementById('form-tedarikci');
    if (formTed) {
      formTed.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg(
            'msg-tedarikci',
            'Kayıt için sunucu bağlantısı gerekli.',
            false
          );
          return;
        }
        if (!isPatron(currentSession)) {
          setMsg(
            'msg-tedarikci',
            'Tedarikçi ekleme yalnız patron içindir.',
            false
          );
          return;
        }
        withFormBusy(formTed, function (done) {
          var kayit = formValues(formTed);
          var row = kayit.row;
          if (row) {
            google.script.run
              .withSuccessHandler(function (res) {
                done();
                setMsg('msg-tedarikci', res.message || '', !!res.ok);
                if (res.ok) {
                  resetTedarikciForm();
                  loadTedarikci();
                }
              })
              .withFailureHandler(rpcFail('msg-tedarikci', done))
              .updateSupplier(row, {
                ad: kayit.ad,
                telefon: kayit.telefon,
                not: kayit.not
              });
          } else {
            google.script.run
              .withSuccessHandler(function (res) {
                done();
                setMsg('msg-tedarikci', res.message || '', !!res.ok);
                if (res.ok) {
                  resetTedarikciForm();
                  loadTedarikci();
                }
              })
              .withFailureHandler(rpcFail('msg-tedarikci', done))
              .addSupplier(kayit);
          }
        });
      });
    }

    if (formFatura) {
      formFatura.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg('msg-fatura', 'Kayıt için sunucu bağlantısı gerekli.', false);
          return;
        }
        var kayit = formValues(formFatura);
        if (!kayit.tedarikci) {
          setMsg('msg-fatura', 'Listeden tedarikçi seçin.', false);
          return;
        }
        withFormBusy(formFatura, function (done) {
          var fileEl = document.getElementById('file-fatura-dekont');
          readFileAsDekont(fileEl, function (filePayload) {
            if (filePayload && filePayload.error) {
              done();
              setMsg('msg-fatura', filePayload.error, false);
              return;
            }
            uploadThen(
              filePayload,
              function (dekont) {
                kayit.dekontFileId = dekont.fileId;
                kayit.dekontUrl = dekont.url;
                google.script.run
                  .withSuccessHandler(function (res) {
                    done();
                    setMsg('msg-fatura', res.message || '', !!res.ok);
                    if (res.ok) {
                      formFatura.reset();
                      loadFatura();
                      refreshOnayBadge();
                    }
                  })
                  .withFailureHandler(rpcFail('msg-fatura', done))
                  .addInvoice(kayit);
              },
              function (err) {
                done();
                setMsg('msg-fatura', err, false);
              }
            );
          });
        });
      });
    }

    var formOdeme = document.getElementById('form-odeme');
    if (formOdeme) {
      formOdeme.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!hasGas()) {
          setMsg('msg-odeme', 'Kayıt için sunucu bağlantısı gerekli.', false);
          return;
        }
        var kayit = formValues(formOdeme);
        if (!kayit.tedarikci) {
          setMsg('msg-odeme', 'Listeden tedarikçi seçin.', false);
          return;
        }
        if (!kayit.yontem) {
          setMsg('msg-odeme', 'Ödeme yöntemi seçin.', false);
          return;
        }
        withFormBusy(formOdeme, function (done) {
          var fileEl = document.getElementById('file-odeme-dekont');
          readFileAsDekont(fileEl, function (filePayload) {
            if (filePayload && filePayload.error) {
              done();
              setMsg('msg-odeme', filePayload.error, false);
              return;
            }
            uploadThen(
              filePayload,
              function (dekont) {
                kayit.dekontFileId = dekont.fileId;
                kayit.dekontUrl = dekont.url;
                google.script.run
                  .withSuccessHandler(function (res) {
                    done();
                    setMsg('msg-odeme', res.message || '', !!res.ok);
                    if (res.ok) {
                      formOdeme.reset();
                      loadOdeme();
                      refreshOnayBadge();
                    }
                  })
                  .withFailureHandler(rpcFail('msg-odeme', done))
                  .addPayment(kayit);
              },
              function (err) {
                done();
                setMsg('msg-odeme', err, false);
              }
            );
          });
        });
      });
    }

    var formLogin = document.getElementById('form-login');
    if (formLogin) {
      formLogin.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!requireGas('msg-login')) return;
        var userId = loginUser && loginUser.value;
        var code = loginCode && loginCode.value;
        if (!userId) {
          setMsg('msg-login', 'Kullanıcı seçin.', false);
          return;
        }
        if (btnLogin) btnLogin.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            if (btnLogin) btnLogin.disabled = false;
            if (!res || !res.ok) {
              setMsg(
                'msg-login',
                (res && res.message) || 'Giriş başarısız.',
                false
              );
              return;
            }
            setMsg('msg-login', res.message || 'Giriş başarılı.', true);
            if (loginCode) loginCode.value = '';
            showApp(res.session);
            switchTab('ozet');
          })
          .withFailureHandler(rpcFail('msg-login', function () { if (btnLogin) btnLogin.disabled = false; }))
          .login(userId, code);
      });
    }

    var btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
      btnLogout.addEventListener('click', function () {
        if (!hasGas()) {
          showLogin();
          return;
        }
        google.script.run
          .withSuccessHandler(function () {
            showLogin();
            setMsg('msg-login', 'Çıkış yapıldı.', true);
            loadLoginUsers();
          })
          .withFailureHandler(rpcFail(null, function () { showLogin(); }))
          .logout();
      });
    }

    var btnForgot = document.getElementById('btn-forgot');
    if (btnForgot) {
      btnForgot.addEventListener('click', function () {
        setMsg(
          'msg-login',
          'Test ortamı: şifreler Config.TEST_USERS / Kullanicilar (ör. Fatih TEST4567, Sercan TEST2345). Canlı hesap şifresi yok.',
          true
        );
      });
    }

    function loadLoginUsers() {
      if (!hasGas()) {
        fillLoginUsers([
          { id: 'test-yalcin', ad: 'Yalçın Özeke' },
          { id: 'test-sercan', ad: 'Sercan Toprak' },
          { id: 'test-aleyna', ad: 'Aleyna Toprak' },
          { id: 'test-fatih', ad: 'Fatih Toprak' }
        ]);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            fillLoginUsers(res.users || []);
          }
        })
        .withFailureHandler(rpcFail('msg-login'))
        .listUsersForLogin();
    }

    function boot() {
      loadLoginUsers();
      if (!hasGas()) {
        showLogin();
        showServerUnreachable();
        setMsg('msg-login', SERVER_UNREACHABLE, false);
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.loggedIn && res.session) {
            showApp(res.session);
            switchTab('ozet');
          } else {
            showLogin();
          }
        })
        .withFailureHandler(rpcFail('msg-login', function () { showLogin(); }))
        .getSession();
    }

    boot();
  })();
</script>
